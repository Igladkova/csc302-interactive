<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab 12 demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a header, a wrapping row of module tabs, then the active module: plot column (left, wide) and
   control column (right); the description sits under the plot. One column on phones.
   Same visual language as the Ch 6-8 course tools (Okabe-Ito palette, Spline Sans + JetBrains Mono). */
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --ink: #1F2433; --muted: #5B6478; --line: #D9DEE7; --grid: #E8ECF2; --focus: #0072B2;
  --exact: #1F2433; --err: #D55E00; --hl: #FFF3D6;
  --c1: #0072B2; --c2: #E69F00; --c3: #009E73; --c4: #CC79A7; --c5: #56B4E9; --c6: #D55E00; --c7: #7A5195;
  --display: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font: 700 1.15rem/1.2 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0; font-size: 0.92rem }
a { color: var(--focus) }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px }
nav.tabs button { font: 500 0.88rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.module { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0 }
.plots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-width: 0 }
.plotbox { min-width: 0; grid-column: 1 / -1 }
.plotbox.half { grid-column: auto }
.ctrl > .matrix, .btns > .ctrl { justify-self: start }
.plotbox .cap { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
canvas { display: block; width: 100%; max-width: 100%; border-radius: 6px; touch-action: none }
.ctrls { display: grid; gap: 12px; align-content: start }
.ctrl { display: grid; gap: 4px }
.ctrl > label, .ctrl .lab { font-size: 0.88rem; display: flex; justify-content: space-between; gap: 10px }
.ctrl .val { font-family: var(--mono); font-variant-numeric: tabular-nums }
.ctrl input[type=range] { width: 100%; accent-color: var(--focus) }
select, input[type=number], input[type=text] { font: inherit; color: inherit; width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg) }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
button.b { font: 600 0.9rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer }
button.b.primary { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem }
.check input { accent-color: var(--focus); margin: 0 }
.matrix { display: inline-grid; gap: 4px; font-family: var(--mono) }
.matrix input { width: 5.4em; padding: 4px 5px; text-align: right; font-family: var(--mono); font-size: 0.85rem }
.readout { font-family: var(--mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; line-height: 1.45; max-height: 360px; overflow-y: auto }
.readout .hl { background: var(--hl) }
.readout table { border-collapse: collapse }
.readout td, .readout th { padding: 1px 8px; text-align: right; white-space: nowrap }
.readout th { color: var(--muted); font-weight: 600 }
.desc { font-size: 0.92rem; max-width: 75ch }
.desc p { margin: 0 0 8px }
.desc .ref { color: var(--muted); font-size: 0.85rem }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted) }
.legend span::before { content: ""; display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--c) }
footer { font-size: 0.8rem; color: var(--muted) }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
@media (max-width: 880px) { .module { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 560px) { .plotbox.half { grid-column: 1 / -1 } }

.readout.code { color: var(--ink); background: var(--hl) }
.plotbox .cap { text-transform: none; letter-spacing: 0; font-size: 0.85rem }

</style>
</head>
<body>
<script>
/* Numerics core for the CSc 301 IEM rebuilds. Pure functions, no DOM: tested in node by test_num.js.
   Matrices are arrays of row arrays. */
const N = (() => {
  "use strict";
  const N = {};

  /* ---------- expressions: parse, compile, differentiate ---------- */
  const FN = { sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp, log: Math.log, ln: Math.log, sqrt: Math.sqrt,
    abs: Math.abs, atan: Math.atan, asin: Math.asin, acos: Math.acos, sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    log10: Math.log10, sign: Math.sign };
  N.parse = function (src) {
    const toks = [], re = /\s*(\d+\.?\d*(?:[eE][-+]?\d+)?|\.\d+(?:[eE][-+]?\d+)?|[A-Za-z_]\w*|\*\*|[-+*/^(),])/y;
    let m, i = 0; src = String(src).trim();
    while (i < src.length) { re.lastIndex = i; m = re.exec(src); if (!m) throw new Error("cannot read '" + src.slice(i) + "'"); toks.push(m[1]); i = re.lastIndex; }
    let k = 0; const peek = () => toks[k], next = () => toks[k++];
    const expect = t => { if (next() !== t) throw new Error("expected " + t); };
    function expr() { let a = term(); while (peek() === "+" || peek() === "-") { const o = next(); a = { t: "op", o, a, b: term() }; } return a; }
    function term() { let a = unary(); while (peek() === "*" || peek() === "/" || (peek() && /^[\w.(]/.test(peek()) && !isOp(peek()))) { const o = (peek() === "*" || peek() === "/") ? next() : "*"; a = { t: "op", o, a, b: unary() }; } return a; }
    function isOp(t) { return t === ")" || t === "," ; }
    function unary() { if (peek() === "-") { next(); return { t: "neg", a: unary() }; } if (peek() === "+") { next(); return unary(); } return power(); }
    function power() { const a = atom(); if (peek() === "^" || peek() === "**") { next(); return { t: "op", o: "^", a, b: unary() }; } return a; }
    function atom() {
      const t = next(); if (t === undefined) throw new Error("unexpected end");
      if (t === "(") { const e = expr(); expect(")"); return e; }
      if (/^[\d.]/.test(t)) return { t: "num", v: parseFloat(t), s: t };
      if (/^[A-Za-z_]/.test(t)) {
        if (peek() === "(" && FN[t]) { next(); const a = expr(); expect(")"); return { t: "fn", f: t === "ln" ? "log" : t, a }; }
        if (t === "pi") return { t: "num", v: Math.PI, s: PI_STR };
        if (t === "e") return { t: "num", v: Math.E, s: E_STR };
        return { t: "var", n: t };
      }
      throw new Error("unexpected '" + t + "'");
    }
    const e = expr(); if (k < toks.length) throw new Error("unexpected '" + toks[k] + "'"); return e;
  };
  N.compile = function (ast, vars) {
    function c(n) {
      switch (n.t) {
        case "num": { const v = n.v; return () => v; }
        case "var": { const j = vars.indexOf(n.n); if (j < 0) throw new Error("unknown variable " + n.n); return a => a[j]; }
        case "neg": { const f = c(n.a); return a => -f(a); }
        case "fn": { const f = c(n.a), g = FN[n.f]; return a => g(f(a)); }
        case "op": { const f = c(n.a), g = c(n.b);
          if (n.o === "+") return a => f(a) + g(a); if (n.o === "-") return a => f(a) - g(a);
          if (n.o === "*") return a => f(a) * g(a); if (n.o === "/") return a => f(a) / g(a);
          return a => Math.pow(f(a), g(a)); }
      }
    }
    const f = c(ast); return (...a) => f(a);
  };
  const num = v => ({ t: "num", v }), isNum = (n, v) => n.t === "num" && (v === undefined || n.v === v);
  function op(o, a, b) {
    if (isNum(a) && isNum(b)) { const r = N.compile({ t: "op", o, a, b }, [])(); if (Number.isFinite(r)) return num(r); }
    if (o === "+") { if (isNum(a, 0)) return b; if (isNum(b, 0)) return a; }
    if (o === "-") { if (isNum(b, 0)) return a; if (isNum(a, 0)) return neg(b); }
    if (o === "*") { if (isNum(a, 0) || isNum(b, 0)) return num(0); if (isNum(a, 1)) return b; if (isNum(b, 1)) return a; }
    if (o === "/") { if (isNum(a, 0)) return num(0); if (isNum(b, 1)) return a; }
    if (o === "^") { if (isNum(b, 1)) return a; if (isNum(b, 0)) return num(1); }
    return { t: "op", o, a, b };
  }
  function neg(a) { if (isNum(a)) return num(-a.v); if (a.t === "neg") return a.a; return { t: "neg", a }; }
  const fn = (f, a) => ({ t: "fn", f, a });
  N.diff = function d(n, x) {
    switch (n.t) {
      case "num": return num(0);
      case "var": return num(n.n === x ? 1 : 0);
      case "neg": return neg(d(n.a, x));
      case "op": {
        const a = n.a, b = n.b, da = d(a, x), db = d(b, x);
        if (n.o === "+" || n.o === "-") return op(n.o, da, db);
        if (n.o === "*") return op("+", op("*", da, b), op("*", a, db));
        if (n.o === "/") return op("/", op("-", op("*", da, b), op("*", a, db)), op("^", b, num(2)));
        if (isNum(db, 0)) return op("*", op("*", b, op("^", a, op("-", b, num(1)))), da);
        return op("*", n, op("+", op("*", db, fn("log", a)), op("/", op("*", b, da), a)));
      }
      case "fn": {
        const a = n.a, da = d(a, x); let g;
        switch (n.f) {
          case "sin": g = fn("cos", a); break; case "cos": g = neg(fn("sin", a)); break;
          case "tan": g = op("/", num(1), op("^", fn("cos", a), num(2))); break;
          case "exp": g = fn("exp", a); break; case "log": g = op("/", num(1), a); break;
          case "log10": g = op("/", num(1 / Math.LN10), a); break;
          case "sqrt": g = op("/", num(0.5), fn("sqrt", a)); break; case "abs": g = fn("sign", a); break;
          case "atan": g = op("/", num(1), op("+", num(1), op("^", a, num(2)))); break;
          case "asin": g = op("/", num(1), fn("sqrt", op("-", num(1), op("^", a, num(2))))); break;
          case "acos": g = neg(op("/", num(1), fn("sqrt", op("-", num(1), op("^", a, num(2)))))); break;
          case "sinh": g = fn("cosh", a); break; case "cosh": g = fn("sinh", a); break;
          case "tanh": g = op("/", num(1), op("^", fn("cosh", a), num(2))); break;
          case "sign": g = num(0); break;
        }
        return op("*", g, da);
      }
    }
  };
  /** Parse src in variables vars; return {f, df:[partials], d2:[[second partials]], ast}. */
  N.func = function (src, vars) {
    const ast = N.parse(src), f = N.compile(ast, vars);
    const dAst = vars.map(v => N.diff(ast, v));
    const df = dAst.map(a => N.compile(a, vars));
    const d2 = dAst.map(a => vars.map(v => N.compile(N.diff(a, v), vars)));
    return { f, df, d2, ast };
  };

  const PREC = { "+": 1, "-": 1, "*": 2, "/": 2, "^": 3 };
  /** Expression back to text (minimal parentheses). */
  N.str = function str(n, parent = 0, right = false) {
    switch (n.t) {
      case "num": return fmt(n.v, 6);
      case "var": return n.n;
      case "neg": { const s = "−" + str(n.a, 3); return parent >= 2 ? "(" + s + ")" : s; }
      case "fn": return n.f + "(" + str(n.a) + ")";
      case "op": { const p = PREC[n.o], s = str(n.a, p, false) + ` ${n.o === "*" ? "×" : n.o === "-" ? "−" : n.o} ` + str(n.b, p, true); return (p < parent || (p === parent && right && n.o !== "^") || (n.o === "^" && parent === 3 && !right)) ? "(" + s + ")" : s; }
    }
  };
  /** Evaluate an expression rounding every input, operation and function value to the system sys (see fpRound).
      Returns {v, steps: [{s, exact, v, flag}]} where exact is the operation done exactly on the rounded operands. */
  N.fpEval = function (ast, vars, vals, sys) {
    const steps = [], R = x => N.fpRound(x, sys);
    function ev(n) {
      switch (n.t) {
        case "num": { const r = R(n.v); if (r.v !== n.v) steps.push({ s: "store " + fmt(n.v, 10), exact: n.v, v: r.v, flag: r.flag }); return r.v; }
        case "var": { const x = vals[vars.indexOf(n.n)], r = R(x); if (r.v !== x) steps.push({ s: "store " + n.n, exact: x, v: r.v, flag: r.flag }); return r.v; }
        case "neg": return -ev(n.a);
        case "fn": { const a = ev(n.a), ex = N.compile({ t: "fn", f: n.f, a: { t: "num", v: a } }, [])(), r = R(ex); steps.push({ s: `${n.f}(${fmt(a, 8)})`, exact: ex, v: r.v, flag: r.flag }); return r.v; }
        case "op": { const a = ev(n.a), b = ev(n.b), ex = N.compile({ t: "op", o: n.o, a: { t: "num", v: a }, b: { t: "num", v: b } }, [])(), r = R(ex);
          steps.push({ s: `${fmt(a, 8)} ${n.o === "*" ? "×" : n.o === "-" ? "−" : n.o} ${fmt(b, 8)}`, exact: ex, v: r.v, flag: r.flag }); return r.v; }
      }
    }
    const v = ev(ast); return { v, steps };
  };

  /* ---------- high-precision reference values ---------- */
  const PI_STR = "3.14159265358979323846264338327950288419716939937510582097494459230781640628620899863";
  const E_STR = "2.71828182845904523536028747135266249775724709369995957496696762772407663035354759457";
  const DIG = 60n, S = 10n ** DIG;                    // fixed-point scale for function evaluation
  const babs = a => a < 0n ? -a : a;
  function gcd(a, b) { a = babs(a); b = babs(b); while (b) [a, b] = [b, a % b]; return a; }
  const rat = (n, d = 1n) => { if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; };
  function ratFromStr(t) { const m = t.match(/^(\d*)(?:\.(\d*))?(?:[eE]([-+]?\d+))?$/); let n = BigInt((m[1] || "0") + (m[2] || "")), d = 10n ** BigInt((m[2] || "").length); const e = parseInt(m[3] || "0", 10); if (e > 0) n *= 10n ** BigInt(e); else if (e < 0) d *= 10n ** BigInt(-e); return rat(n, d); }
  function ratFromDouble(x) { if (x === 0) return rat(0n); let e = 0; while (!Number.isInteger(x) && e < 1100) { x *= 2; e++; } return rat(BigInt(x), 2n ** BigInt(e)); }
  function ratToDouble(r) {
    if (r.n === 0n) return 0; const neg = r.n < 0n, n = babs(r.n);
    const sh = BigInt(n.toString(2).length - r.d.toString(2).length - 60);   // scale so the quotient has ~60 bits
    const q = sh >= 0n ? n / (r.d << sh) : (n << -sh) / r.d;
    const v = Number(q) * Math.pow(2, Number(sh)); return neg ? -v : v;
  }
  const toFix = r => r.n * S / r.d, fromFix = v => rat(v, S);
  const fmul = (a, b) => a * b / S, fdiv = (a, b) => a * S / b;
  function isqrt(n) { if (n < 2n) return n; let x = BigInt(Math.floor(Math.sqrt(Number(n)))) || 1n; for (;;) { const y = (x + n / x) >> 1n; if (babs(y - x) <= 1n) { while (y * y > n) return y - 1n; return y; } x = y; } }
  function fexp(x) { let m = 0n; while (babs(x) > S / 2n) { x /= 2n; m++; } let t = S, s = S; for (let k = 1n; k < 80n; k++) { t = fmul(t, x) / k; if (t === 0n) break; s += t; } for (; m > 0n; m--) s = fmul(s, s); return s; }
  function fatanh(z) { let s = 0n, p = z; const z2 = fmul(z, z); for (let k = 1n; k < 400n; k += 2n) { const t = p / k; if (t === 0n) break; s += t; p = fmul(p, z2); } return s; }
  const LN2 = 2n * fatanh(S / 3n);
  function flog(x) { if (x <= 0n) throw new Error("log of a non-positive number"); let m = 0n; while (x > 2n * S) { x /= 2n; m++; } while (x < S / 2n) { x *= 2n; m--; } return 2n * fatanh(fdiv(x - S, x + S)) + m * LN2; }
  const FPI = ratFromStr(PI_STR.slice(0, 70)), PIF = toFix(FPI);
  function fsincos(x) { const tp = 2n * PIF; x = x % tp; if (x > PIF) x -= tp; if (x < -PIF) x += tp; let s = 0n, c = 0n, t = S; for (let k = 0n; k < 120n; k++) { if (t === 0n) break; if (k % 2n === 0n) c += (k % 4n === 0n ? t : -t); else s += (k % 4n === 1n ? t : -t); t = fmul(t, x) / (k + 1n); } return [s, c]; }
  /** Value of an expression without rounding error (exact rationals for + − × ÷ and integer powers, 60-digit
      fixed point for sqrt, exp, log, sin, cos, tan); other functions fall back to double precision. */
  N.exactEval = function (ast) {
    function ev(n) {
      switch (n.t) {
        case "num": return n.s ? ratFromStr(n.s) : ratFromDouble(n.v);
        case "var": throw new Error("variables not allowed");
        case "neg": { const a = ev(n.a); return { n: -a.n, d: a.d }; }
        case "op": {
          const a = ev(n.a), b = ev(n.b);
          if (n.o === "+") return rat(a.n * b.d + b.n * a.d, a.d * b.d); if (n.o === "-") return rat(a.n * b.d - b.n * a.d, a.d * b.d);
          if (n.o === "*") return rat(a.n * b.n, a.d * b.d); if (n.o === "/") { if (b.n === 0n) throw new Error("division by zero"); return rat(a.n * b.d, a.d * b.n); }
          if (b.d === 1n && babs(b.n) <= 4000n) { const k = b.n, p = rat(a.n ** babs(k), a.d ** babs(k)); return k < 0n ? rat(p.d, p.n) : p; }
          if (b.d === 2n && b.n === 1n) return ev({ t: "fn", f: "sqrt", a: n.a });
          return fromFix(fexp(fmul(toFix(b), flog(toFix(a)))));
        }
        case "fn": {
          const a = ev(n.a), x = toFix(a);
          switch (n.f) {
            case "sqrt": if (a.n < 0n) throw new Error("sqrt of a negative number"); return rat(isqrt(a.n * S * S / a.d), S);
            case "exp": return fromFix(fexp(x));
            case "log": return fromFix(flog(x));
            case "sin": return fromFix(fsincos(x)[0]);
            case "cos": return fromFix(fsincos(x)[1]);
            case "tan": { const [s, c] = fsincos(x); return fromFix(fdiv(s, c)); }
            case "abs": return { n: babs(a.n), d: a.d };
            default: return ratFromDouble(FN[n.f](ratToDouble(a)));
          }
        }
      }
    }
    return ratToDouble(ev(ast));
  };

  /* ---------- exact simulated arithmetic (rationals rounded to p digits in base beta) ---------- */
  const Q = {};

  }

  const PRE_DET = {

  const detArea = {
    id: "det-area", title: "Determinant = signed area",
    ref: "Determinants (supplement) · Lab 12, Recap and Part 1",
    desc: `<p>A 2 × 2 matrix A sends the unit square (green) to the parallelogram spanned by its columns, A e₁ (red) and A e₂ (purple).
      The <b>determinant</b> det A = a₁₁a₂₂ − a₁₂a₂₁ is the area of that parallelogram with a sign: <b>+</b> if going from A e₁ to A e₂ is still counterclockwise,
      <b>−</b> if A flips the plane like a mirror (orange fill). Every area in the plane gets multiplied by |det A|.</p>
      <p>Applying A twice multiplies areas twice: det(A²) = (det A)², and in general <b>det(AB) = det A · det B</b>.</p>`,
    tries: ["Pick the shear and the rotation. Why is det = 1 for both, even though the shapes change?",
      "Pick the reflection. Which way do you turn from the red edge to the purple edge? What is the sign of det?",
      "Pick the projection. What happens to the square, and why is det = 0? Can a projection be undone?",
      "Set 'apply A k times' to 3. Check that the area is |det A|³."],
    init(ctx) {
      const plot = ctx.plot("Unit square (green) and its image under Aᵏ", { aspect: "1 / 0.85", equal: true });
      const pre = UI.select({ label: "Preset", value: "warm", options: [["warm", "warm-up [[2, 1], [0, 1]]"], ["swap", "swap coordinates [[0, 1], [1, 0]]"], ["scale", "scaling 1.5 I"], ["shear", "shear k = 0.3"], ["rot", "rotation 30°"], ["refl", "reflection through the 60° line"], ["proj", "projection onto the 30° line"], ["rs", "R(30°) diag(0.5, 1.5) (Lab 7)"]] },
        () => { E.set(PRE_DET[pre.value]); ctx.redraw(); });
      const E = entrySliders(ctx, PRE_DET.warm, -2, 2, 0.05);
      const k = UI.slider({ label: "apply A k times", min: 1, max: 4, step: 1, value: 1, fmt: v => v }, () => ctx.redraw());
      ctx.add(pre, ...E.sl, k); const out = ctx.readout("Area and orientation"), code = M2.code(ctx);
      return () => {
        const A = E.get(), Ak = matPow(A, k.value), d = det2(A), dk = det2(Ak);
        const sq = [[0, 0], [1, 0], [1, 1], [0, 1]], img = sq.map(p => N.mv(Ak, p));
        const ext = Math.min(8, Math.max(2.2, ...img.flat().map(Math.abs)) * 1.1);
        plot.view(-ext, ext, -ext, ext).begin("x₁", "x₂");
        for (let g = -6; g <= 6; g++) { const p = N.mv(Ak, [g, -6]), q = N.mv(Ak, [g, 6]), r = N.mv(Ak, [-6, g]), s = N.mv(Ak, [6, g]); plot.seg(p[0], p[1], q[0], q[1], { color: "--muted", width: 0.8, alpha: 0.35 }).seg(r[0], r[1], s[0], s[1], { color: "--muted", width: 0.8, alpha: 0.35 }); }
        plot.fill(sq.map(p => p[0]), sq.map(p => p[1]), { color: "--c3", alpha: 0.25, stroke: true, width: 1.5 });
        if (Math.abs(dk) > 1e-12) plot.fill(img.map(p => p[0]), img.map(p => p[1]), { color: dk > 0 ? "--c1" : "--c2", alpha: 0.3, stroke: true, width: 1.5 });
        else plot.line(img.map(p => p[0]).concat(img[0][0]), img.map(p => p[1]).concat(img[0][1]), { color: "--err", width: 3 });
        plot.arrow(0, 0, Ak[0][0], Ak[1][0], { color: "--err", width: 3.5 }).arrow(0, 0, Ak[0][1], Ak[1][1], { color: "--c5", width: 3.5 });
        plot.text(Ak[0][0], Ak[1][0], k.value > 1 ? "Aᵏe₁" : "Ae₁", { color: "--err", bold: true, dx: 6, dy: 10 }).text(Ak[0][1], Ak[1][1], k.value > 1 ? "Aᵏe₂" : "Ae₂", { color: "--c5", bold: true, dx: 6, dy: -10 });
        plot.note(`det = ${fmt(dk, 4)}: ${Math.abs(dk) < 1e-12 ? "squashed flat (area 0)" : dk > 0 ? "orientation kept (counterclockwise)" : "orientation flipped (clockwise)"}`, { bold: true, color: Math.abs(dk) < 1e-12 ? "--err" : dk > 0 ? "--c1" : "--c2" }).end();
        out.textContent = M2.lines(`det A = a₁₁a₂₂ − a₁₂a₂₁`, `      = ${fmt(A[0][0], 3)}·${fmt(A[1][1], 3)} − ${fmt(A[0][1], 3)}·${fmt(A[1][0], 3)} = ${fmt(d, 4)}`,
          k.value > 1 ? `det(A^${k.value}) = ${fmt(dk, 4)},  (det A)^${k.value} = ${fmt(d ** k.value, 4)}` : "", `area of the image = |det| = ${fmt(Math.abs(dk), 4)}`);
        code.textContent = M2.lines(`A = ${pyMat(A, 3)}`, "print(np.linalg.det(A))", k.value > 1 ? `Ak = np.linalg.matrix_power(A, ${k.value})\nprint(np.linalg.det(Ak), np.linalg.det(A)**${k.value})` : "");
      };
    },
  };

  /* ---------- det from LU ---------- */
  const PRE_LU = { lab10: [[1, 3, 4], [2, 1, 3], [4, 1, 2]], swap: [[1, 1, 1], [2, 2, 5], [4, 6, 8]], vol: [[1, 0, 1], [0, 2, 1], [1, 1, 3]], sing: [[1, 2, 3], [4, 5, 6], [7, 8, 9]] };
  const detLU = {
    id: "det-lu", title: "Determinant from LU",
    ref: "Determinants (supplement), VMLS §10.1 · Lab 12, Part 1",
    desc: `<p>The cofactor formula from lecture needs about n! multiplications. Instead, use the LU factorization with partial pivoting from Lab 10, PA = LU.
      L has ones on its diagonal, so det L = 1. U is upper triangular, so det U is the product of its diagonal. Every row swap flips the sign. So</p>
      <p style="text-align:center"><b>det A = (−1)<sup>number of row swaps</sup> · u₁₁ u₂₂ ⋯ uₙₙ</b>,</p>
      <p>for the price of one LU, about (2/3)n³ flops. The plot compares the two costs on a computer doing 10⁹ flops per second.</p>`,
    tries: ["Pick 'needs a row swap'. How many swaps happen? Check the sign of det.",
      "Pick the singular matrix. Which diagonal entry of U is 0 (or ≈0, because of rounding)?",
      "Swap two rows of the 3-D volume matrix by retyping it. What happens to det?",
      "On the plot: for which n does the cofactor formula take more than a year? And LU?"],
    init(ctx) {
      const cv = ctx.canvas("P A = L U   (diagonal of U framed)");
      const plot = ctx.plot("Cost of det: cofactor expansion vs LU (log scale)", { aspect: "16 / 9", logy: true });
      const pre = UI.select({ label: "Matrix", value: "lab10", options: [["lab10", "Lab 10 example"], ["swap", "needs a row swap (Lab 10)"], ["vol", "3-D volume example"], ["sing", "singular: rows 1, 2, 3 = 1…9"], ["rand", "random 4 × 4"]] }, () => {
        if (pre.value === "rand") { const r = N.rng(Math.floor(Math.random() * 1e6)); Ain.value = N.zeros(4, 4).map(row => row.map(() => Math.round(10 * M2.randn(r)) / 10)); } else Ain.value = PRE_LU[pre.value];
        ctx.redraw(); });
      const Ain = UI.matrix({ label: "A (type your own)", rows: 3, cols: 3, value: PRE_LU.lab10 }, () => ctx.redraw());
      ctx.add(pre, Ain); const out = ctx.readout("det A"), code = M2.code(ctx);
      return () => {
        const A = Ain.value, n = A.length;
        if (A.flat().some(v => !Number.isFinite(v))) { out.textContent = "type numbers in every box"; return; }
        const r = N.lu(A, "partial", true), swaps = r.steps.filter(s => !s.done && s.swapRow !== s.k).length;
        const P = r.p.map(i => N.eye(n)[i]), U = r.U.map(row => row.map(v => Math.abs(v) < 1e-13 ? 0 : v)), prod = r.U.reduce((s, row, i) => s * row[i], 1), dt = (swaps % 2 ? -1 : 1) * prod;
        UI.drawMats(cv, [{ M: P, title: "P", d: 1 }, { M: A, title: "A", d: 3 }, { M: r.L, title: "L", d: 3 }, { M: U, title: "U", d: 4, hl: (i, j) => i === j ? (Math.abs(U[i][i]) < 1e-10 ? "--err" : "--c5") : null }], { cell: 52 });
        const ns = [...Array(24).keys()].map(i => i + 2), fact = m => { let f = 1; for (let i = 2; i <= m; i++) f *= i; return f; };
        plot.view(2, 25, 1, 1e32).begin("n", "flops");
        for (const [v, lab] of [[1e9, "1 second"], [3.15e16, "1 year"], [4.4e26, "age of the universe"]]) { plot.hline(v, { color: "--muted", width: 1, dash: [4, 4] }); plot.text(24.7, v, lab, { color: "--muted", size: 11, dy: -9, align: "right" }); }
        plot.line(ns, ns.map(m => Math.max(1, Math.E * fact(m))), { color: "--c2", width: 2.5 }).line(ns, ns.map(m => 2 / 3 * m ** 3), { color: "--c1", width: 2.5 });
        plot.vline(n, { color: "--c5", width: 1.5, dash: [3, 3] });
        plot.note("cofactor expansion ≈ e·n!", { color: "--c2", bold: true }).note("LU ≈ (2/3)n³", { color: "--c1", bold: true, line: 1 }).end();
        out.textContent = M2.lines(`row swaps: ${swaps}  → sign ${swaps % 2 ? "−1" : "+1"}`, `u₁₁ ⋯ uₙₙ = ${r.U.map((row, i) => fmt(row[i], 4)).join(" · ")}`, `          = ${fmt(prod, 6)}`,
          `det A = ${fmt(Math.abs(dt) < 1e-12 ? 0 : dt, 6)}`, `np.linalg.det(A) = ${fmt(Math.abs(N.det(A)) < 1e-12 ? 0 : N.det(A), 6)}`);
        code.textContent = M2.lines(`A = ${pyMat(A, 3)}`, "print(det_lu(A))", "print(np.linalg.det(A))   # NumPy also uses LU");
      };
    },
  };

  /* ---------- iterating a 2 x 2 matrix ---------- */
  const PRE_IT = { spiral: N.mm([[0.95, 0], [0, 0.95]], rot(15 * deg)), rot: rot(15 * deg), grow: N.mm([[1.05, 0], [0, 1.05]], rot(15 * deg)), d2: [[2, 0], [0, 0.1]], d9: [[0.9, 0], [0, 0.5]], shear: [[1, 0.2], [0, 1]], city: [[0.5, 0.4], [0.5, 0.6]] };
  const iterate = {
    id: "iterate-2x2", title: "Iterating a 2 × 2 matrix",
    ref: "VMLS §9.1, §10.3 · Lab 12, Part 2",
    desc: `<p>A <b>linear dynamical system</b> x<sub>t+1</sub> = A x<sub>t</sub> applies the same matrix again and again. After t steps the state is x<sub>t+1</sub> = A<sup>t</sup> x<sub>1</sub> (matrix power).
      Here the state is a 2-vector, so we can draw its <b>trajectory</b> x₁, x₂, x₃, … as dots in the plane. The shaded shape is the unit square after the chosen number of steps:
      its area is |det A|<sup>t</sup>.</p>`,
    tries: ["Spiral: A = 0.95 R(15°). How many steps until the state goes once around? What is det A, and how does the square shrink?",
      "Rotation (det = 1) vs growing spiral (det > 1). Which trajectories stay on a circle?",
      "Pick diag(2, 0.1). Here det A = 0.2 < 1, so areas shrink. Does x_t go to 0? (Try several starting angles.)",
      "City–suburb (columns add up to 1). Where does the state settle? Does it depend on where you start?"],
    init(ctx) {
      const plot = ctx.plot("Trajectory x₁, x₂, …, x_T (x₁ in red)", { aspect: "1 / 0.85", equal: true });
      const nplot = ctx.plot("‖x_t‖ (log scale)", { aspect: "16 / 6", logy: true });
      const pre = UI.select({ label: "Preset", value: "spiral", options: [["spiral", "spiral 0.95 R(15°)"], ["rot", "rotation R(15°)"], ["grow", "growing spiral 1.05 R(15°)"], ["d2", "diag(2, 0.1)"], ["d9", "diag(0.9, 0.5)"], ["shear", "shear [[1, 0.2], [0, 1]]"], ["city", "city–suburb [[0.5, 0.4], [0.5, 0.6]]"]] },
        () => { E.set(PRE_IT[pre.value]); if (pre.value === "city") ang.value = 0; ctx.redraw(); });
      const E = entrySliders(ctx, PRE_IT.spiral, -2, 2, 0.01);
      const ang = UI.slider({ label: "x₁ = (cos φ, sin φ), φ in degrees", min: 0, max: 360, step: 5, value: 0, fmt: v => v + "°" }, () => ctx.redraw());
      const T = UI.slider({ label: "T (number of states)", min: 2, max: 80, step: 1, value: 60, fmt: v => v }, () => ctx.redraw());
      const ts = UI.slider({ label: "show the unit square after t steps", min: 0, max: 30, step: 1, value: 6, fmt: v => v }, () => ctx.redraw());
      ctx.add(pre, ...E.sl, ang, T, ts); const out = ctx.readout("Determinant and size"), code = M2.code(ctx);
      return () => {
        const A = E.get(), x1 = [Math.cos(ang.value * deg), Math.sin(ang.value * deg)], X = [x1];
        for (let t = 1; t < T.value; t++) X.push(N.mv(A, X[t - 1]));
        const d = det2(A), At = matPow(A, ts.value), sq = [[0, 0], [1, 0], [1, 1], [0, 1]].map(p => N.mv(At, p));
        const ext = Math.min(6, Math.max(1.3, ...X.flat().filter(Number.isFinite).map(Math.abs).map(v => Math.min(v, 6))) * 1.1);
        plot.view(-ext, ext, -ext, ext).begin("x₁ (first entry)", "second entry");
        if (Math.abs(det2(At)) > 1e-12) plot.fill(sq.map(p => p[0]), sq.map(p => p[1]), { color: "--c3", alpha: 0.25, stroke: true, width: 1.2 });
        plot.line(X.map(p => p[0]), X.map(p => p[1]), { color: "--c1", width: 1.2, alpha: 0.6 }).pts(X.map(p => p[0]), X.map(p => p[1]), { color: "--c1", r: 3 });
        plot.pts([x1[0]], [x1[1]], { color: "--err", r: 5.5 }).text(x1[0], x1[1], "x₁", { color: "--err", bold: true, dx: 8, dy: -10 });
        plot.note(`square after ${ts.value} steps: area |det A|^${ts.value} = ${fmt(Math.abs(d) ** ts.value, 4)}`, { color: "--c3", bold: true }).end();
        const nr = X.map(p => Math.min(1e8, Math.max(1e-8, N.norm(p)))), tt = X.map((_, i) => i + 1);
        const [lo, hi] = [Math.min(...nr), Math.max(...nr)];
        nplot.view(1, T.value, Math.min(0.1, lo / 2), Math.max(10, hi * 2)).begin("t", "").line(tt, nr, { color: "--c1", width: 2 }).pts(tt, nr, { color: "--c1", r: 2 }).hline(1, { color: "--muted", width: 1, dash: [4, 4] }).end();
        const xT = X[X.length - 1];
        out.textContent = M2.lines(`det A = ${fmt(d, 4)}`, `x_T = ${M2.vec(xT, 4)},  ‖x_T‖ = ${fmt(N.norm(xT), 4)}`, `A^${ts.value} = ${M2.vec(At[0], 3)} / ${M2.vec(At[1], 3)}  (rows)`);
        code.textContent = M2.lines(`A = ${pyMat(A, 3)}`, `x1 = ${pyMat([x1], 3).replace("np.array([[", "np.array([").replace("]])", "])")}`, `X = simulate(A, x1, ${T.value})     # columns x_1 ... x_T`, `np.linalg.matrix_power(A, ${ts.value}) @ x1   # = X[:, ${ts.value}]`);
      };
    },
  };

  /* ---------- population model (made-up data with the shapes of VMLS Figures 9.1-9.3) ---------- */
  const AGES = [...Array(100).keys()];
  const BIRTH = AGES.map(a => { for (const [s, r] of [[15, .017], [20, .045], [25, .054], [30, .048], [35, .023], [40, .005], [45, .0005]]) if (a >= s && a < s + 5) return r; return 0; });
  const DEATH = AGES.map(a => a === 0 ? 0.006 : 0.0004 + 0.00003 * Math.exp(0.095 * a));
  const X2010 = AGES.map(a => { const v = 4 + 0.4 * Math.exp(-(((a - 50) / 8) ** 2)); return a > 60 ? v * Math.exp(-(((a - 60) / 20) ** 2)) : v; });
  const popStep = (x, bm = 1, dm = 1, imm = 0) => { const y = new Array(100); y[0] = bm * N.dot(BIRTH, x); for (let i = 0; i < 99; i++) y[i + 1] = (1 - dm * DEATH[i]) * x[i]; for (let i = 20; i < 40; i++) y[i] += imm; return y; };
  const stepXY = (x) => { const xs = [], ys = []; x.forEach((v, i) => { xs.push(i, i + 1); ys.push(v, v); }); return [xs, ys]; };
  const sum = v => v.reduce((s, a) => s + a, 0);

  const population = {
    id: "population", title: "Population dynamics",
    ref: "VMLS §9.2 · Lab 12, Part 2",
    desc: `<p>The state x<sub>t</sub> is a 100-vector: entry i is the number of people (millions) of age i − 1 in year t. Each year, the newborns are bᵀx<sub>t</sub> (b = birth rates),
      and everyone else gets one year older, a fraction d<sub>i</sub> of them dying: (x<sub>t+1</sub>)<sub>i+1</sub> = (1 − d<sub>i</sub>)(x<sub>t</sub>)<sub>i</sub>. So x<sub>t+1</sub> = A x<sub>t</sub>
      with bᵀ in the first row of A and 1 − d just below the diagonal. With immigration u (people aged 20–39), x<sub>t+1</sub> = A x<sub>t</sub> + u.</p>
      <p>The rates and the 2010 distribution are <b>made up</b>, with the same shapes as the census data in VMLS Figures 9.1–9.3.</p>`,
    tries: ["Move the years slider from 0 to 30. Follow the 'baby boom' bump around age 50. Where is it in 2040?",
      "Cut the birth rates by 20% (0.8). What happens to the total after 50 years?",
      "Add immigration 0.03 million per age 20–39. How do the total and the number of children change?",
      "Double the death rates. Which ages change the most?"],
    init(ctx) {
      const plot = ctx.plot("Age distribution (millions per year of age)", { aspect: "16 / 8" });
      const tplot = ctx.plot("Total population (millions)", { aspect: "16 / 6" });
      const yrs = UI.slider({ label: "years after 2010", min: 0, max: 100, step: 1, value: 10, fmt: v => `${v} (year ${2010 + v})` }, () => ctx.redraw());
      const bm = UI.slider({ label: "birth rates × ", min: 0.5, max: 1.5, step: 0.05, value: 1, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      const dm = UI.slider({ label: "death rates ×", min: 0.5, max: 2, step: 0.05, value: 1, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      const im = UI.slider({ label: "immigration (millions per age 20–39, per year)", min: 0, max: 0.1, step: 0.005, value: 0, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      ctx.add(yrs, bm, dm, im, UI.buttons([["reset", () => { bm.value = 1; dm.value = 1; im.value = 0; ctx.redraw(); }]]));
      const out = ctx.readout("In the chosen year"), code = M2.code(ctx);
      return () => {
        const X = [X2010]; for (let t = 0; t < 100; t++) X.push(popStep(X[t], bm.value, dm.value, im.value));
        const xt = X[yrs.value], [ax, ay] = stepXY(X2010), [bx, by] = stepXY(xt);
        const top = Math.max(5, ...xt) * 1.08;
        plot.view(0, 100, 0, top).begin("age", "millions").line(ax, ay, { color: "--muted", width: 1.5 }).line(bx, by, { color: "--c1", width: 2.2 })
          .note("2010", { bold: true }).note(`${2010 + yrs.value}`, { color: "--c1", bold: true, line: 1 }).end();
        const tot = X.map(sum), years = X.map((_, i) => 2010 + i);
        tplot.view(2010, 2110, 0, Math.max(450, ...tot) * 1.05).begin("year", "").line(years, tot, { color: "--c1", width: 2 }).line(years, X.map(x => sum(x.slice(65))), { color: "--c2", width: 2 })
          .vline(2010 + yrs.value, { color: "--muted", width: 1, dash: [3, 3] }).note("total", { color: "--c1", bold: true }).note("age 65+", { color: "--c2", bold: true, line: 1 }).end();
        out.textContent = M2.lines(`year ${2010 + yrs.value}`, `total:            ${fmt(sum(xt), 4)} M  (2010: ${fmt(sum(X2010), 4)} M)`, `children 5–18:    ${fmt(sum(xt.slice(5, 19)), 4)} M`, `age 65+:          ${fmt(sum(xt.slice(65)), 4)} M`);
        const lines = ["A = A_pop.copy()"]; if (bm.value !== 1) lines.push(`A[0, :] = ${fmt(bm.value, 3)} * b`); if (dm.value !== 1) lines.push(`A[np.arange(1, 100), np.arange(99)] = 1 - ${fmt(dm.value, 3)} * d[:99]`);
        if (im.value) lines.push("u = np.zeros(100)", `u[20:40] = ${fmt(im.value, 3)}`, "x = x2010.copy()", `for t in range(${yrs.value}):`, "    x = A @ x + u");
        else lines.push(`x = np.linalg.matrix_power(A, ${yrs.value}) @ x2010`);
        code.textContent = M2.lines(lines, "print(x.sum(), x[65:].sum())");
      };
    },
  };

  /* ---------- epidemic ---------- */
  const NAMES = ["Susceptible", "Infected", "Recovered", "Deceased"], COLS = ["--c1", "--c2", "--c3", "--ink"];
  const epidemic = {
    id: "epidemic", title: "Epidemic dynamics",
    ref: "VMLS §9.3 · Lab 12, Part 2",
    desc: `<p>The state x<sub>t</sub> holds the fractions of the population that are susceptible, infected, recovered (immune) and deceased on day t.
      Each day a fraction of the susceptible get infected; of the infected, some recover with immunity, some recover without immunity (and are susceptible again),
      some die, and the rest stay infected. Column j of A says where the people in group j go, so <b>every column adds up to 1</b>: nobody appears or disappears.</p>`,
    tries: ["With the book's numbers (5%, 10%, 4%, 1%), what fraction dies in the end? On which day is the infection at its peak?",
      "Raise immune recovery to 12%. How do the death toll and the peak change?",
      "Set non-immune recovery to 0. Does the epidemic end faster or slower?",
      "Check the column sums of A in the picture. Why does that make the four fractions add up to 1 every day?"],
    init(ctx) {
      const plot = ctx.plot("Fractions of the population over time", { aspect: "16 / 9" });
      const cv = ctx.canvas("A (column j: where group j goes)");
      const inf = UI.slider({ label: "infected per day (of the susceptible)", min: 0, max: 0.2, step: 0.005, value: 0.05, fmt: v => fmt(100 * v, 3) + "%" }, () => ctx.redraw());
      const rec = UI.slider({ label: "recover with immunity (of the infected)", min: 0, max: 0.3, step: 0.005, value: 0.10, fmt: v => fmt(100 * v, 3) + "%" }, () => ctx.redraw());
      const non = UI.slider({ label: "recover without immunity", min: 0, max: 0.2, step: 0.005, value: 0.04, fmt: v => fmt(100 * v, 3) + "%" }, () => ctx.redraw());
      const die = UI.slider({ label: "die", min: 0, max: 0.05, step: 0.001, value: 0.01, fmt: v => fmt(100 * v, 3) + "%" }, () => ctx.redraw());
      const days = UI.slider({ label: "days", min: 50, max: 400, step: 10, value: 200, fmt: v => v }, () => ctx.redraw());
      ctx.add(UI.buttons([["book (VMLS §9.3)", () => { inf.value = 0.05; rec.value = 0.10; non.value = 0.04; die.value = 0.01; ctx.redraw(); }]]), inf, rec, non, die, days);
      const out = ctx.readout("Peak and final state"), code = M2.code(ctx);
      return () => {
        const a = inf.value, r = rec.value, nn = non.value, dd = die.value, stay = 1 - r - nn - dd;
        const A = [[1 - a, nn, 0, 0], [a, stay, 0, 0], [0, r, 1, 0], [0, dd, 0, 1]];
        if (stay < -1e-12) { plot.view(0, 1, 0, 1).begin().note("recover + recover without immunity + die is more than 100%: lower one of them", { color: "--err", bold: true }).end(); out.textContent = "the infected column of A would have a negative entry"; return; }
        const X = [[1, 0, 0, 0]]; for (let t = 1; t < days.value; t++) X.push(N.mv(A, X[t - 1]));
        const tt = X.map((_, i) => i + 1);
        plot.view(1, days.value, 0, 1).begin("day t", "fraction");
        NAMES.forEach((nm, i) => plot.line(tt, X.map(x => x[i]), { color: COLS[i], width: 2.2 }).note(nm, { color: COLS[i], bold: true, line: i + 6, right: true }));
        let pk = 0; X.forEach((x, i) => { if (x[1] > X[pk][1]) pk = i; });
        plot.pts([pk + 1], [X[pk][1]], { color: "--c2", r: 5 }).end();
        const cs = [0, 1, 2, 3].map(j => A.reduce((s, row) => s + row[j], 0));
        UI.drawMats(cv, [{ M: A, title: "A", d: 3, hl: (i, j) => j === 1 && i === 1 ? "--c2" : null }, { M: [cs], title: "column sums", d: 3 }], { cell: 58 });
        const xl = X[X.length - 1];
        out.textContent = M2.lines(`stay infected: ${fmt(100 * stay, 3)}% per day`, `peak: ${fmt(100 * X[pk][1], 3)}% infected on day ${pk + 1}`, `day ${days.value}: S ${fmt(xl[0], 3)}, I ${fmt(xl[1], 3)}, R ${fmt(xl[2], 3)}, D ${fmt(xl[3], 3)}`, `sum of the four fractions: ${fmt(sum(xl), 6)}`);
        code.textContent = M2.lines(`A_sir = ${pyMat(A, 4).replace(/\], \[/g, "],\n                  [")}`, `X = simulate(A_sir, np.array([1.0, 0, 0, 0]), ${days.value})`, "print(X[:, -1])");
      };
    },
  };

  /* ---------- the long run: eigenvector preview ---------- */
  const longRun = {
    id: "long-run", title: "The long run (eigenvector preview)",
    ref: "Eigenvalues (lecture) · Lab 12, Part 3",
    desc: `<p>Run the population model for a long time. The total keeps changing, but the <b>shape</b> of the age distribution, the unit vector x<sub>t</sub>/‖x<sub>t</sub>‖, stops changing.
      Once the direction stops changing, A x<sub>t</sub> is just a multiple of x<sub>t</sub>: <b>A v = λ v</b>. Such a v is an <b>eigenvector</b> of A and λ is its <b>eigenvalue</b>
      (Lab 13 computes them). λ is the yearly growth factor in the long run: the population grows if λ &gt; 1 and shrinks if λ &lt; 1.</p>`,
    tries: ["Move t from 0 to 400. After about how many years does the shape stop changing?",
      "Watch the readout ‖A v − λ v‖ as t grows. What does it tell you?",
      "Change the birth rates. Which multiplier gives λ ≈ 1 (a population that neither grows nor shrinks)?"],
    init(ctx) {
      const plot = ctx.plot("Shape of the age distribution, x_t / ‖x_t‖", { aspect: "16 / 8" });
      const gplot = ctx.plot("Growth factor ‖x_{t+1}‖ / ‖x_t‖ each year", { aspect: "16 / 6" });
      const ts = UI.slider({ label: "t (years after 2010)", min: 0, max: 400, step: 1, value: 20, fmt: v => v }, () => ctx.redraw());
      const bm = UI.slider({ label: "birth rates ×", min: 0.5, max: 1.5, step: 0.01, value: 1, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      ctx.add(ts, bm); const out = ctx.readout("Is v an eigenvector?"), code = M2.code(ctx);
      let cacheKey = null, X = null;
      return () => {
        if (cacheKey !== bm.value) { X = [X2010]; for (let t = 0; t < 401; t++) X.push(popStep(X[t], bm.value)); cacheKey = bm.value; }
        const shape = x => N.scale(x, 1 / N.norm(x)), t = ts.value, v = shape(X[t]), vEnd = shape(X[400]);
        const ratio = X.slice(0, 401).map((x, i) => N.norm(X[i + 1]) / N.norm(x)), lam = ratio[t];
        const [a0, b0] = stepXY(shape(X2010)), [a1, b1] = stepXY(v), [a2, b2] = stepXY(vEnd);
        plot.view(0, 100, 0, Math.max(0.2, ...v, ...vEnd) * 1.1).begin("age", "").line(a0, b0, { color: "--muted", width: 1.2 }).line(a2, b2, { color: "--exact", width: 2, dash: [6, 4] }).line(a1, b1, { color: "--c1", width: 2.2 })
          .note("2010", { bold: true }).note(`year ${2010 + t}`, { color: "--c1", bold: true, line: 1 }).note("year 2410 (dashed)", { bold: true, line: 2 }).end();
        const yrs = ratio.map((_, i) => i), [lo, hi] = UI.range(ratio, 0.15);
        gplot.view(0, 400, Math.min(lo, 0.98), Math.max(hi, 1.02)).begin("t", "").hline(1, { color: "--muted", width: 1, dash: [4, 4] }).line(yrs, ratio, { color: "--c2", width: 2 })
          .vline(t, { color: "--c1", width: 1.2, dash: [3, 3] }).pts([t], [lam], { color: "--c1", r: 4.5 }).note(`λ ≈ ${fmt(ratio[400], 6)} in the long run`, { color: "--c2", bold: true }).end();
        const Av = popStep(v, bm.value), resid = N.norm(N.add(Av, v, -lam)), change = N.norm(N.add(shape(X[t + 1]), v, -1));
        out.textContent = M2.lines(`v = x_t / ‖x_t‖ at t = ${t}`, `λ = ‖A v‖ = ‖x_{t+1}‖ / ‖x_t‖ = ${fmt(lam, 6)}`, `‖A v − λ v‖ = ${fmt(resid, 3)}`, `change in shape this year: ${fmt(change, 3)}`,
          ratio[400] > 1 ? "λ > 1: grows in the long run" : "λ < 1: shrinks in the long run");
        code.textContent = M2.lines(`X = simulate(A_pop, x2010, ${t + 1})`, `v = X[:, ${t}] / np.linalg.norm(X[:, ${t}])`, "lam = np.linalg.norm(A_pop @ v)     # growth factor", "print(np.linalg.norm(A_pop @ v - lam * v))");
      };
    },
  };

  UI.page(Object.assign({}, PAGE, { modules: [detArea, detLU, iterate, population, epidemic, longRun] }));
})();

</script>
