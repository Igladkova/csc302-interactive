<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab 6 demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a header, a wrapping row of module tabs, then the active module: plot column (left, wide) and
   control column (right); the description sits under the plot. One column on phones.
   Same visual language as the Ch 6-8 course tools (Okabe-Ito palette, Spline Sans + JetBrains Mono). */
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --ink: #1F2433; --muted: #5B6478; --line: #D9DEE7; --grid: #E8ECF2; --focus: #0072B2;
  --exact: #1F2433; --err: #D55E00; --hl: #FFF3D6;
  --c1: #0072B2; --c2: #E69F00; --c3: #009E73; --c4: #CC79A7; --c5: #56B4E9; --c6: #D55E00; --c7: #7A5195;
  --display: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font: 700 1.15rem/1.2 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0; font-size: 0.92rem }
a { color: var(--focus) }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px }
nav.tabs button { font: 500 0.88rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.module { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0 }
.plots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-width: 0 }
.plotbox { min-width: 0; grid-column: 1 / -1 }
.plotbox.half { grid-column: auto }
.ctrl > .matrix, .btns > .ctrl { justify-self: start }
.plotbox .cap { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
canvas { display: block; width: 100%; max-width: 100%; border-radius: 6px; touch-action: none }
.ctrls { display: grid; gap: 12px; align-content: start }
.ctrl { display: grid; gap: 4px }
.ctrl > label, .ctrl .lab { font-size: 0.88rem; display: flex; justify-content: space-between; gap: 10px }
.ctrl .val { font-family: var(--mono); font-variant-numeric: tabular-nums }
.ctrl input[type=range] { width: 100%; accent-color: var(--focus) }
select, input[type=number], input[type=text] { font: inherit; color: inherit; width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg) }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
button.b { font: 600 0.9rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer }
button.b.primary { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem }
.check input { accent-color: var(--focus); margin: 0 }
.matrix { display: inline-grid; gap: 4px; font-family: var(--mono) }
.matrix input { width: 5.4em; padding: 4px 5px; text-align: right; font-family: var(--mono); font-size: 0.85rem }
.readout { font-family: var(--mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; line-height: 1.45; max-height: 360px; overflow-y: auto }
.readout .hl { background: var(--hl) }
.readout table { border-collapse: collapse }
.readout td, .readout th { padding: 1px 8px; text-align: right; white-space: nowrap }
.readout th { color: var(--muted); font-weight: 600 }
.desc { font-size: 0.92rem; max-width: 75ch }
.desc p { margin: 0 0 8px }
.desc .ref { color: var(--muted); font-size: 0.85rem }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted) }
.legend span::before { content: ""; display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--c) }
footer { font-size: 0.8rem; color: var(--muted) }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
@media (max-width: 880px) { .module { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 560px) { .plotbox.half { grid-column: 1 / -1 } }

.readout.code { color: var(--ink); background: var(--hl) }
.plotbox .cap { text-transform: none; letter-spacing: 0; font-size: 0.85rem }

</style>
</head>
<body>
<script>
/* Numerics core for the CSc 301 IEM rebuilds. Pure functions, no DOM: tested in node by test_num.js.
   Matrices are arrays of row arrays. */
const N = (() => {
  "use strict";
  const N = {};

  /* ---------- expressions: parse, compile, differentiate ---------- */
  const FN = { sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp, log: Math.log, ln: Math.log, sqrt: Math.sqrt,
    abs: Math.abs, atan: Math.atan, asin: Math.asin, acos: Math.acos, sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    log10: Math.log10, sign: Math.sign };
  N.parse = function (src) {
    const toks = [], re = /\s*(\d+\.?\d*(?:[eE][-+]?\d+)?|\.\d+(?:[eE][-+]?\d+)?|[A-Za-z_]\w*|\*\*|[-+*/^(),])/y;
    let m, i = 0; src = String(src).trim();
    while (i < src.length) { re.lastIndex = i; m = re.exec(src); if (!m) throw new Error("cannot read '" + src.slice(i) + "'"); toks.push(m[1]); i = re.lastIndex; }
    let k = 0; const peek = () => toks[k], next = () => toks[k++];
    const expect = t => { if (next() !== t) throw new Error("expected " + t); };
    function expr() { let a = term(); while (peek() === "+" || peek() === "-") { const o = next(); a = { t: "op", o, a, b: term() }; } return a; }
    function term() { let a = unary(); while (peek() === "*" || peek() === "/" || (peek() && /^[\w.(]/.test(peek()) && !isOp(peek()))) { const o = (peek() === "*" || peek() === "/") ? next() : "*"; a = { t: "op", o, a, b: unary() }; } return a; }
    function isOp(t) { return t === ")" || t === "," ; }
    function unary() { if (peek() === "-") { next(); return { t: "neg", a: unary() }; } if (peek() === "+") { next(); return unary(); } return power(); }
    function power() { const a = atom(); if (peek() === "^" || peek() === "**") { next(); return { t: "op", o: "^", a, b: unary() }; } return a; }
    function atom() {
      const t = next(); if (t === undefined) throw new Error("unexpected end");
      if (t === "(") { const e = expr(); expect(")"); return e; }
      if (/^[\d.]/.test(t)) return { t: "num", v: parseFloat(t), s: t };
      if (/^[A-Za-z_]/.test(t)) {
        if (peek() === "(" && FN[t]) { next(); const a = expr(); expect(")"); return { t: "fn", f: t === "ln" ? "log" : t, a }; }
        if (t === "pi") return { t: "num", v: Math.PI, s: PI_STR };
        if (t === "e") return { t: "num", v: Math.E, s: E_STR };
        return { t: "var", n: t };
      }
      throw new Error("unexpected '" + t + "'");
    }
    const e = expr(); if (k < toks.length) throw new Error("unexpected '" + toks[k] + "'"); return e;
  };
  N.compile = function (ast, vars) {
    function c(n) {
      switch (n.t) {
        case "num": { const v = n.v; return () => v; }
        case "var": { const j = vars.indexOf(n.n); if (j < 0) throw new Error("unknown variable " + n.n); return a => a[j]; }
        case "neg": { const f = c(n.a); return a => -f(a); }
        case "fn": { const f = c(n.a), g = FN[n.f]; return a => g(f(a)); }
        case "op": { const f = c(n.a), g = c(n.b);
          if (n.o === "+") return a => f(a) + g(a); if (n.o === "-") return a => f(a) - g(a);
          if (n.o === "*") return a => f(a) * g(a); if (n.o === "/") return a => f(a) / g(a);
          return a => Math.pow(f(a), g(a)); }
      }
    }
    const f = c(ast); return (...a) => f(a);
  };
  const num = v => ({ t: "num", v }), isNum = (n, v) => n.t === "num" && (v === undefined || n.v === v);
  function op(o, a, b) {
    if (isNum(a) && isNum(b)) { const r = N.compile({ t: "op", o, a, b }, [])(); if (Number.isFinite(r)) return num(r); }
    if (o === "+") { if (isNum(a, 0)) return b; if (isNum(b, 0)) return a; }
    if (o === "-") { if (isNum(b, 0)) return a; if (isNum(a, 0)) return neg(b); }
    if (o === "*") { if (isNum(a, 0) || isNum(b, 0)) return num(0); if (isNum(a, 1)) return b; if (isNum(b, 1)) return a; }
    if (o === "/") { if (isNum(a, 0)) return num(0); if (isNum(b, 1)) return a; }
    if (o === "^") { if (isNum(b, 1)) return a; if (isNum(b, 0)) return num(1); }
    return { t: "op", o, a, b };
  }
  function neg(a) { if (isNum(a)) return num(-a.v); if (a.t === "neg") return a.a; return { t: "neg", a }; }
  const fn = (f, a) => ({ t: "fn", f, a });
  N.diff = function d(n, x) {
    switch (n.t) {
      case "num": return num(0);
      case "var": return num(n.n === x ? 1 : 0);
      case "neg": return neg(d(n.a, x));
      case "op": {
        const a = n.a, b = n.b, da = d(a, x), db = d(b, x);
        if (n.o === "+" || n.o === "-") return op(n.o, da, db);
        if (n.o === "*") return op("+", op("*", da, b), op("*", a, db));
        if (n.o === "/") return op("/", op("-", op("*", da, b), op("*", a, db)), op("^", b, num(2)));
        if (isNum(db, 0)) return op("*", op("*", b, op("^", a, op("-", b, num(1)))), da);
        return op("*", n, op("+", op("*", db, fn("log", a)), op("/", op("*", b, da), a)));
      }
      case "fn": {
        const a = n.a, da = d(a, x); let g;
        switch (n.f) {
          case "sin": g = fn("cos", a); break; case "cos": g = neg(fn("sin", a)); break;
          case "tan": g = op("/", num(1), op("^", fn("cos", a), num(2))); break;
          case "exp": g = fn("exp", a); break; case "log": g = op("/", num(1), a); break;
          case "log10": g = op("/", num(1 / Math.LN10), a); break;
          case "sqrt": g = op("/", num(0.5), fn("sqrt", a)); break; case "abs": g = fn("sign", a); break;
          case "atan": g = op("/", num(1), op("+", num(1), op("^", a, num(2)))); break;
          case "asin": g = op("/", num(1), fn("sqrt", op("-", num(1), op("^", a, num(2))))); break;
          case "acos": g = neg(op("/", num(1), fn("sqrt", op("-", num(1), op("^", a, num(2)))))); break;
          case "sinh": g = fn("cosh", a); break; case "cosh": g = fn("sinh", a); break;
          case "tanh": g = op("/", num(1), op("^", fn("cosh", a), num(2))); break;
          case "sign": g = num(0); break;
        }
        return op("*", g, da);
      }
    }
  };
  /** Parse src in variables vars; return {f, df:[partials], d2:[[second partials]], ast}. */
  N.func = function (src, vars) {
    const ast = N.parse(src), f = N.compile(ast, vars);
    const dAst = vars.map(v => N.diff(ast, v));
    const df = dAst.map(a => N.compile(a, vars));
    const d2 = dAst.map(a => vars.map(v => N.compile(N.diff(a, v), vars)));
    return { f, df, d2, ast };
  };

  const PREC = { "+": 1, "-": 1, "*": 2, "/": 2, "^": 3 };
  /** Expression back to text (minimal parentheses). */
  N.str = function str(n, parent = 0, right = false) {
    switch (n.t) {
      case "num": return fmt(n.v, 6);
      case "var": return n.n;
      case "neg": { const s = "−" + str(n.a, 3); return parent >= 2 ? "(" + s + ")" : s; }
      case "fn": return n.f + "(" + str(n.a) + ")";
      case "op": { const p = PREC[n.o], s = str(n.a, p, false) + ` ${n.o === "*" ? "×" : n.o === "-" ? "−" : n.o} ` + str(n.b, p, true); return (p < parent || (p === parent && right && n.o !== "^") || (n.o === "^" && parent === 3 && !right)) ? "(" + s + ")" : s; }
    }
  };
  /** Evaluate an expression rounding every input, operation and function value to the system sys (see fpRound).
      Returns {v, steps: [{s, exact, v, flag}]} where exact is the operation done exactly on the rounded operands. */
  N.fpEval = function (ast, vars, vals, sys) {
    const steps = [], R = x => N.fpRound(x, sys);
    function ev(n) {
      switch (n.t) {
        case "num": { const r = R(n.v); if (r.v !== n.v) steps.push({ s: "store " + fmt(n.v, 10), exact: n.v, v: r.v, flag: r.flag }); return r.v; }
        case "var": { const x = vals[vars.indexOf(n.n)], r = R(x); if (r.v !== x) steps.push({ s: "store " + n.n, exact: x, v: r.v, flag: r.flag }); return r.v; }
        case "neg": return -ev(n.a);
        case "fn": { const a = ev(n.a), ex = N.compile({ t: "fn", f: n.f, a: { t: "num", v: a } }, [])(), r = R(ex); steps.push({ s: `${n.f}(${fmt(a, 8)})`, exact: ex, v: r.v, flag: r.flag }); return r.v; }
        case "op": { const a = ev(n.a), b = ev(n.b), ex = N.compile({ t: "op", o: n.o, a: { t: "num", v: a }, b: { t: "num", v: b } }, [])(), r = R(ex);
          steps.push({ s: `${fmt(a, 8)} ${n.o === "*" ? "×" : n.o === "-" ? "−" : n.o} ${fmt(b, 8)}`, exact: ex, v: r.v, flag: r.flag }); return r.v; }
      }
    }
    const v = ev(ast); return { v, steps };
  };

  /* ---------- high-precision reference values ---------- */
  const PI_STR = "3.14159265358979323846264338327950288419716939937510582097494459230781640628620899863";
  const E_STR = "2.71828182845904523536028747135266249775724709369995957496696762772407663035354759457";
  const DIG = 60n, S = 10n ** DIG;                    // fixed-point scale for function evaluation
  const babs = a => a < 0n ? -a : a;
  function gcd(a, b) { a = babs(a); b = babs(b); while (b) [a, b] = [b, a % b]; return a; }
  const rat = (n, d = 1n) => { if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; };
  function ratFromStr(t) { const m = t.match(/^(\d*)(?:\.(\d*))?(?:[eE]([-+]?\d+))?$/); let n = BigInt((m[1] || "0") + (m[2] || "")), d = 10n ** BigInt((m[2] || "").length); const e = parseInt(m[3] || "0", 10); if (e > 0) n *= 10n ** BigInt(e); else if (e < 0) d *= 10n ** BigInt(-e); return rat(n, d); }
  function ratFromDouble(x) { if (x === 0) return rat(0n); let e = 0; while (!Number.isInteger(x) && e < 1100) { x *= 2; e++; } return rat(BigInt(x), 2n ** BigInt(e)); }
  function ratToDouble(r) {
    if (r.n === 0n) return 0; const neg = r.n < 0n, n = babs(r.n);
    const sh = BigInt(n.toString(2).length - r.d.toString(2).length - 60);   // scale so the quotient has ~60 bits
    const q = sh >= 0n ? n / (r.d << sh) : (n << -sh) / r.d;
    const v = Number(q) * Math.pow(2, Number(sh)); return neg ? -v : v;
  }
  const toFix = r => r.n * S / r.d, fromFix = v => rat(v, S);
  const fmul = (a, b) => a * b / S, fdiv = (a, b) => a * S / b;
  function isqrt(n) { if (n < 2n) return n; let x = BigInt(Math.floor(Math.sqrt(Number(n)))) || 1n; for (;;) { const y = (x + n / x) >> 1n; if (babs(y - x) <= 1n) { while (y * y > n) return y - 1n; return y; } x = y; } }
  function fexp(x) { let m = 0n; while (babs(x) > S / 2n) { x /= 2n; m++; } let t = S, s = S; for (let k = 1n; k < 80n; k++) { t = fmul(t, x) / k; if (t === 0n) break; s += t; } for (; m > 0n; m--) s = fmul(s, s); return s; }
  function fatanh(z) { let s = 0n, p = z; const z2 = fmul(z, z); for (let k = 1n; k < 400n; k += 2n) { const t = p / k; if (t === 0n) break; s += t; p = fmul(p, z2); } return s; }
  const LN2 = 2n * fatanh(S / 3n);
  function flog(x) { if (x <= 0n) throw new Error("log of a non-positive number"); let m = 0n; while (x > 2n * S) { x /= 2n; m++; } while (x < S / 2n) { x *= 2n; m--; } return 2n * fatanh(fdiv(x - S, x + S)) + m * LN2; }
  const FPI = ratFromStr(PI_STR.slice(0, 70)), PIF = toFix(FPI);
  function fsincos(x) { const tp = 2n * PIF; x = x % tp; if (x > PIF) x -= tp; if (x < -PIF) x += tp; let s = 0n, c = 0n, t = S; for (let k = 0n; k < 120n; k++) { if (t === 0n) break; if (k % 2n === 0n) c += (k % 4n === 0n ? t : -t); else s += (k % 4n === 1n ? t : -t); t = fmul(t, x) / (k + 1n); } return [s, c]; }
  /** Value of an expression without rounding error (exact rationals for + − × ÷ and integer powers, 60-digit
      fixed point for sqrt, exp, log, sin, cos, tan); other functions fall back to double precision. */
  N.exactEval = function (ast) {
    function ev(n) {
      switch (n.t) {
        case "num": return n.s ? ratFromStr(n.s) : ratFromDouble(n.v);
        case "var": throw new Error("variables not allowed");
        case "neg": { const a = ev(n.a); return { n: -a.n, d: a.d }; }
        case "op": {
          const a = ev(n.a), b = ev(n.b);
          if (n.o === "+") return rat(a.n * b.d + b.n * a.d, a.d * b.d); if (n.o === "-") return rat(a.n * b.d - b.n * a.d, a.d * b.d);
          if (n.o === "*") return rat(a.n * b.n, a.d * b.d); if (n.o === "/") { if (b.n === 0n) throw new Error("division by zero"); return rat(a.n * b.d, a.d * b.n); }
          if (b.d === 1n && babs(b.n) <= 4000n) { const k = b.n, p = rat(a.n ** babs(k), a.d ** babs(k)); return k < 0n ? rat(p.d, p.n) : p; }
          if (b.d === 2n && b.n === 1n) return ev({ t: "fn", f: "sqrt", a: n.a });
          return fromFix(fexp(fmul(toFix(b), flog(toFix(a)))));
        }
        case "fn": {
          const a = ev(n.a), x = toFix(a);
          switch (n.f) {
            case "sqrt": if (a.n < 0n) throw new Error("sqrt of a negative number"); return rat(isqrt(a.n * S * S / a.d), S);
            case "exp": return fromFix(fexp(x));
            case "log": return fromFix(flog(x));
            case "sin": return fromFix(fsincos(x)[0]);
            case "cos": return fromFix(fsincos(x)[1]);
            case "tan": { const [s, c] = fsincos(x); return fromFix(fdiv(s, c)); }
            case "abs": return { n: babs(a.n), d: a.d };
            default: return ratFromDouble(FN[n.f](ratToDouble(a)));
          }
        }
      }
    }
    return ratToDouble(ev(ast));
  };

  /* ---------- exact simulated arithmetic (rationals rounded to p digits in base beta) ---------- */
  const Q = {};

  const runM = n => [...Array(n)].map((_, i) => [...Array(n)].map((_, j) => j <= i ? 1 : 0));

  const MATS = {

    ref: "VMLS §6.1–6.3 · Lab 6, Part 1",
    desc: `<p>An m × n matrix has m rows and n columns; A<sub>ij</sub> is the entry in row i, column j. Its <b>columns</b> are m-vectors and its <b>rows</b> are n-vectors.
      Python counts from 0, so the book's A<sub>ij</sub> is <code>A[i-1, j-1]</code>, row i is <code>A[i-1, :]</code> and column j is <code>A[:, j-1]</code>.
      The <b>transpose</b> A<sup>T</sup> swaps rows and columns: (A<sup>T</sup>)<sub>ij</sub> = A<sub>ji</sub>. Blue cells are positive, orange negative; blank-looking cells are zero.</p>`,
    tries: ["With the book example, find A₂₃ = −0.1 and A₃₂ = −1. What are the Python indices?",

      const tr = UI.check({ label: "show the transpose Aᵀ", value: false }, () => ctx.redraw());

      let seed = 6; ctx.add(which, tr, I, J, UI.buttons([["new random matrix", () => { seed++; ctx.redraw(); }]]));

      return () => {
        const M0 = MATS[which.value][1] ? MATS[which.value][1]() : (() => { const r = N.rng(seed); return [...Array(3)].map(() => [...Array(4)].map(() => Math.floor(7 * r()) - 3)); })();
        const A = tr.value ? N.T(M0) : M0, m = A.length, n = A[0].length; setMax(I, m); setMax(J, n);

        const sym = M0.length === M0[0].length && M0.every((r, a) => r.every((v, b) => v === M0[b][a]));

          M0.length === M0[0].length ? (sym ? "square and symmetric: Aᵀ = A" : "square, but not symmetric") : "not square, so it cannot be symmetric");
        code.textContent = M2.lines(MATS[which.value][2], `print(${P}.shape)          # (${m}, ${n})`, `print(${P}[${i}, ${j}])          # entry (${i + 1}, ${j + 1})`, `print(${P}[${i}, :])          # row ${i + 1}`, `print(${P}[:, ${j}])          # column ${j + 1}`);
      };
    },
  };

  /* ---------- 2. three ways to compute A x ---------- */
  const matvec = {
    id: "matvec", title: "Three ways to compute A x",
    ref: "VMLS §6.4 · Lab 6, Part 2",
    desc: `<p>For a 2 × 3 matrix A and a 3-vector x, y = Ax is a 2-vector. You can compute it in two ways that give the same answer:
      <b>rows</b>: y<sub>i</sub> is the inner product of row i of A with x; <b>columns</b>: y = x<sub>1</sub>a<sub>1</sub> + x<sub>2</sub>a<sub>2</sub> + x<sub>3</sub>a<sub>3</sub>, a linear combination of the columns.
      The plot shows the column picture: the three scaled columns placed head to tail end at y. (The double loop of the notebook is the row picture written out one product at a time.)</p>`,
    tries: ["With the book example A = [0 2 −1; −2 1 1] and x = (2, 1, −1), check y = (3, −4) both ways.",
      "Set x = (0, 1, 0). Which column of A do you get? Why?",
      "Find an x ≠ 0 with A x = 0. (Hint: three 2-vectors are always dependent.)",
      "Turn on 'A * x'. Why is that an m × n matrix and not A x?"],
    init(ctx) {
      const plot = ctx.plot("Column picture: y = x₁a₁ + x₂a₂ + x₃a₃", { aspect: "4 / 3", equal: true });
      const cv = ctx.canvas("A, x and y = A x");
      const mode = UI.select({ label: "Show", value: "cols", options: [["cols", "columns: y is a combination of the columns"], ["rows", "rows: y_i = (row i) · x"]] }, () => ctx.redraw());
      const Am = UI.matrix({ label: "A (2 × 3), edit the entries", rows: 2, cols: 3, value: [[0, 2, -1], [-2, 1, 1]] }, () => ctx.redraw());
      const X = [2, 1, -1].map((v, i) => UI.slider({ label: `x${i + 1}`, min: -3, max: 3, step: 0.1, value: v, fmt: t => fmt(t, 3) }, () => ctx.redraw()));
      const star = UI.check({ label: "also show A * x (NumPy broadcasting)", value: false }, () => ctx.redraw());
      ctx.add(mode, Am, ...X, star, UI.buttons([["book example", () => { Am.value = [[0, 2, -1], [-2, 1, 1]]; [2, 1, -1].forEach((v, i) => X[i].value = v); ctx.redraw(); }]]));
      const out = ctx.readout("The arithmetic"), code = M2.code(ctx);
      return () => {
        const A = Am.value; if (A.flat().some(v => !Number.isFinite(v))) return;
        const x = X.map(s => s.value), y = N.mv(A, x), cols = [0, 1, 2].map(j => [A[0][j], A[1][j]]);
        const pts = [[0, 0]]; cols.forEach((c, j) => pts.push(N.add(pts[j], c, x[j])));
        const R = Math.max(3, ...pts.flat().map(Math.abs), ...cols.flat().map(Math.abs)) * 1.15;
        plot.view(-R, R, -R, R).begin("", "");
        const C = ["--c1", "--c2", "--c7"];
        cols.forEach((c, j) => plot.arrow(0, 0, c[0], c[1], { color: C[j], width: 1.5, alpha: 0.35 }).text(c[0], c[1], `a${j + 1}`, { color: C[j], dx: 5, dy: -8, bold: true, alpha: 0.6 }));
        if (mode.value === "cols") cols.forEach((c, j) => { const p = pts[j], q = pts[j + 1]; plot.arrow(p[0], p[1], q[0], q[1], { color: C[j], width: 3 }); if (Math.hypot(q[0] - p[0], q[1] - p[1]) > 0.3) plot.text((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, `x${j + 1}a${j + 1}`, { color: C[j], dx: 6, dy: 8, bold: true, size: 11 }); });
        plot.arrow(0, 0, y[0], y[1], { color: "--c3", width: 3.5 }).pts([y[0]], [y[1]], { color: "--c3", r: 5 }).text(y[0], y[1], "y = Ax", { color: "--c3", bold: true, dx: 8, dy: 10, size: 13 });
        plot.note(`y = ${M2.vec(y)}`, { bold: true, color: "--ink" }).end();
        const rowsMode = mode.value === "rows", mats = [{ M: A, title: "A", d: 3, hl: rowsMode ? (i => i === 0 ? "--c3" : "--c4") : ((i, j) => C[j]) },
          { M: M2.col(x), title: "x", d: 3, hl: rowsMode ? null : (i => C[i]) }, { M: M2.col(y), title: "y = A x", d: 4, hl: rowsMode ? (i => i === 0 ? "--c3" : "--c4") : (() => "--c3") }];
        if (star.value) mats.push({ M: A.map(r => r.map((v, j) => v * x[j])), title: "A * x  (2 × 3!)", d: 3 });
        UI.drawMats(cv, mats, { cell: 52 });
        const t = v => fmt(nv(v), 3), p = v => v < 0 ? `(${t(v)})` : t(v);
        out.textContent = rowsMode ? M2.lines([0, 1].map(i => `y${i + 1} = ${A[i].map((a, j) => `${p(a)}·${p(x[j])}`).join(" + ")}\n   = ${t(y[i])}`))
          : M2.lines(`y = ${p(x[0])}·${M2.vec(cols[0])}`, `  + ${p(x[1])}·${M2.vec(cols[1])}`, `  + ${p(x[2])}·${M2.vec(cols[2])}`, `  = ${M2.vec(y)}`);
        if (star.value) out.textContent += "\n\nA * x multiplies column j by x_j:\nits row sums are A @ x.";
        code.textContent = M2.lines(`A = ${pym(A)}`, `x = ${pyv(x)}`, rowsMode ? "y = np.array([A[0, :] @ x, A[1, :] @ x])" : "y = x[0]*A[:, 0] + x[1]*A[:, 1] + x[2]*A[:, 2]", "print(y, A @ x)     # the same", star.value ? "print(A * x)        # NOT the product!" : "");
      };
    },
  };

  /* ---------- 3. difference, running sum, Vandermonde ---------- */
  const SIGS = { sq: ["squares k²", k => k * k, "np.arange(1, n+1)**2"], sin: ["sine wave", k => Math.sin(k / 3), "np.sin(np.arange(1, n+1) / 3)"],
    step: ["step", (k, n) => k > n / 2 ? 1 : 0, "(np.arange(1, n+1) > n/2) * 1.0"], ones: ["all ones", () => 1, "np.ones(n)"] };
  const bookm = {
    id: "book-matrices", title: "Difference, running sum, Vandermonde",
    ref: "VMLS §6.4 · Lab 6, Part 2",
    desc: `<p>Some matrices from the book, each a different job done by y = Ax.
      The <b>difference matrix</b> D ((n−1) × n) gives Dx = (x<sub>2</sub> − x<sub>1</sub>, …, x<sub>n</sub> − x<sub>n−1</sub>).
      The <b>running sum matrix</b> S (n × n, ones on and below the diagonal) gives (Sx)<sub>i</sub> = x<sub>1</sub> + ⋯ + x<sub>i</sub>. Differences undo running sums: D(Sx) is x without its first entry.
      The <b>Vandermonde matrix</b> with rows (1, t<sub>i</sub>, t<sub>i</sub><sup>2</sup>, t<sub>i</sub><sup>3</sup>) evaluates the polynomial with coefficients c at all the points t<sub>i</sub> at once: y = Vc.</p>`,
    tries: ["Difference of the squares 1, 4, 9, 16, …: what pattern do you see? What about differences of a step?",
      "Running sum of all ones: what is S·1?",
      "Pick 'D after S'. Which entry of x is lost?",
      "Vandermonde: set c = (1, −2, 0, 1), the book's p(t) = 1 − 2t + t³. Add more points m. How many points do you need to draw the curve well?"],
    init(ctx) {
      const plot = ctx.plot("x (gray) and y = A x", { aspect: "16 / 8" }), cv = ctx.canvas("The matrix (blue = 1 or positive, orange = negative)");
      const kind = UI.select({ label: "Matrix", value: "diff", options: [["diff", "difference matrix D"], ["run", "running sum matrix S"], ["ds", "D after S: D (S x)"], ["vand", "Vandermonde: evaluate a polynomial"]] }, () => { show(); ctx.redraw(); });
      const sig = UI.select({ label: "Signal x", value: "sq", options: Object.entries(SIGS).map(([k, v]) => [k, v[0]]) }, () => ctx.redraw());
      const n = UI.slider({ label: "n (length of x)", min: 3, max: 30, step: 1, value: 8, fmt: v => v }, () => ctx.redraw());
      const C = [1, -2, 0, 1].map((v, i) => UI.slider({ label: `c${i} (coefficient of t${["⁰", "¹", "²", "³"][i]})`, min: -3, max: 3, step: 0.1, value: v, fmt: t => fmt(t, 3) }, () => ctx.redraw()));
      const m = UI.slider({ label: "m (number of points t_i in [−2, 2])", min: 2, max: 40, step: 1, value: 9, fmt: v => v }, () => ctx.redraw());
      ctx.add(kind, sig, n, ...C, m); const out = ctx.readout("Result"), code = M2.code(ctx);
      function show() { const v = kind.value === "vand"; sig.el.hidden = n.el.hidden = v; C.forEach(s => s.el.hidden = !v); m.el.hidden = !v; }
      show();
      return () => {
        if (kind.value === "vand") {
          const c = C.map(s => s.value), mm = m.value, t = [...Array(mm).keys()].map(i => -2 + 4 * i / (mm - 1)), V = t.map(s => [1, s, s * s, s * s * s]), y = N.mv(V, c);
          const p = s => c[0] + c[1] * s + c[2] * s * s + c[3] * s ** 3, [lo, hi] = UI.range([y, [-2, 2].map(p), [-1, 1]], 0.1);
          plot.view(-2.1, 2.1, lo, hi).begin("t", "").fn(p, -2, 2, { color: "--muted", width: 1, dash: [4, 3] }).line(t, y, { color: "--c1", width: 2 }).pts(t, y, { color: "--c1", r: 4 })
            .note("dashed: the true curve p(t)", { color: "--muted" }).note(`V @ c at ${mm} points, joined by straight lines`, { color: "--c1", bold: true, line: 1 }).end();
          if (mm <= 12) UI.drawMats(cv, [{ M: V, title: `V (${mm} × 4)`, d: 3 }, { M: M2.col(c), title: "c", d: 3 }, { M: M2.col(y), title: "y = V c", d: 3 }], { cell: 52 });
          else M2.pattern(cv, V, { maxCell: 14 });
          out.textContent = M2.lines(`p(t) = ${fmt(c[0], 3)} + ${fmt(c[1], 3)} t + ${fmt(c[2], 3)} t² + ${fmt(c[3], 3)} t³`, `V is ${mm} × 4; one product V @ c`, `evaluates p at all ${mm} points`);
          code.textContent = M2.lines(`c = ${pyv(c)}`, `t = np.linspace(-2, 2, ${mm})`, "V = np.vander(t, 4, increasing=True)", "y = V @ c         # p(t_1), ..., p(t_m)");
          return;
        }
        const nn = n.value, f = SIGS[sig.value][1], x = [...Array(nn).keys()].map(k => f(k + 1, nn)), K = kind.value;
        const A = K === "diff" ? diffM(nn) : K === "run" ? runM(nn) : N.mm(diffM(nn), runM(nn)), y = N.mv(A, x), kx = x.map((_, i) => i + 1), ky = y.map((_, i) => i + 1 + (K === "run" ? 0 : 0.5));
        const [lo, hi] = UI.range([x, y, [0]], 0.1);
        plot.view(0.3, nn + 0.7, lo, hi).begin("index", "");
        M2.stems(plot, kx, x, { color: "--muted", r: 3 }); M2.stems(plot, ky, y, { color: "--c1", r: 4 });
        plot.note("x", { color: "--muted", bold: true }).note(K === "diff" ? "D x (between neighbors)" : K === "run" ? "S x" : "D (S x)", { color: "--c1", bold: true, line: 1 }).end();
        if (nn <= 12) UI.drawMats(cv, [{ M: A, title: `${K === "diff" ? "D" : K === "run" ? "S" : "D S"} (${A.length} × ${nn})`, d: 2 }], { cell: 40 }); else M2.pattern(cv, A, { maxCell: 14 });
        out.textContent = M2.lines(`x = ${M2.vec(x.slice(0, 10), 3)}${nn > 10 ? " …" : ""}`, `y = ${M2.vec(y.slice(0, 10), 3)}${y.length > 10 ? " …" : ""}`, `${A.length} × ${nn} matrix, ${M2.nnz(A)} nonzero entries of ${A.length * nn}`);
        code.textContent = M2.lines(`n = ${nn}`, `x = ${SIGS[sig.value][2]}`, K !== "run" ? "D = np.eye(n)[1:] - np.eye(n)[:-1]" : "", K !== "diff" ? "S = np.tril(np.ones((n, n)))" : "",
          K === "diff" ? "print(D @ x, np.diff(x))" : K === "run" ? "print(S @ x, np.cumsum(x))" : "print(D @ (S @ x))").replace(/\n\n+/g, "\n");
      };
    },
  };

  /* ---------- 4. induced norm ---------- */
  const PN = { 2: [2, "2 (Euclidean)", "2"], 1: [1, "1 (sum of |entries|)", "1"], inf: [Infinity, "∞ (largest |entry|)", "np.inf"] };
  const unitPt = (t, p) => { const v = [Math.cos(t), Math.sin(t)]; return N.scale(v, 1 / N.norm(v, p)); };
  const induced = {
    id: "matrix-norm", title: "How much can A stretch a vector?",
    ref: "VMLS §6.3, beyond the book · Lab 6, Part 3",
    desc: `<p>The book's matrix norm ‖A‖ (the <b>Frobenius</b> norm) is the norm of all mn entries as one long vector. Another very common norm measures A as a function:
      the <b>induced norm</b> ‖A‖<sub>p</sub> = max ‖Ax‖<sub>p</sub> over all x with ‖x‖<sub>p</sub> = 1, the largest stretch factor.
      The blue curve is the "unit circle" of the p-norm (a circle, a diamond or a square, as in Lab 3); A maps it to the red curve. Move x around the unit circle with the slider.
      For p = 1 the answer is the largest absolute <i>column</i> sum, for p = ∞ the largest absolute <i>row</i> sum.</p>`,
    tries: ["With p = 2, move x until ‖Ax‖ is largest. Compare with ‖A‖₂ in the readout.",
      "Set A = diag(3, −5) (b = c = 0). What are ‖A‖₂ and the Frobenius norm? Why?",
      "Switch to p = 1 and p = ∞. Check the column-sum and row-sum rules.",
      "Is the Frobenius norm ever smaller than ‖A‖₂?"],
    init(ctx) {
      const plot = ctx.plot("Unit vectors x (blue) and their images A x (red)", { aspect: "4 / 3", equal: true });
      const plot2 = ctx.plot("Stretch factor (length of A x) for each x on the unit circle", { aspect: "16 / 6" });
      const p = UI.select({ label: "Vector norm p", value: "2", options: Object.entries(PN).map(([k, v]) => [k, v[1]]) }, () => ctx.redraw());
      const E = [["a (row 1, col 1)", 2], ["b (row 1, col 2)", 0.5], ["c (row 2, col 1)", -1], ["d (row 2, col 2)", 1]].map(([l, v]) => UI.slider({ label: l, min: -3, max: 3, step: 0.1, value: v, fmt: t => fmt(t, 3) }, () => ctx.redraw()));
      const th = UI.slider({ label: "x: angle around the unit circle", min: 0, max: 360, step: 1, value: 40, fmt: v => v + "°" }, () => ctx.redraw());
      const set = v => { E.forEach((s, i) => s.value = v[i]); ctx.redraw(); };
      ctx.add(p, th, ...E, UI.buttons([["notebook A", () => set([2, 0.5, -1, 1])], ["diag(3, −5)", () => set([3, 0, 0, -5])], ["rotation 30°", () => set([0.866, -0.5, 0.5, 0.866])], ["rank one", () => set([1, 2, 0.5, 1])]]));
      const out = ctx.readout("Norms"), code = M2.code(ctx);
      return () => {
        const [a, b, c, d] = E.map(s => s.value), A = [[a, b], [c, d]], P = PN[p.value][0], T = [...Array(721).keys()].map(i => i * Math.PI / 360);
        const X = T.map(t => unitPt(t, P)), Y = X.map(x => N.mv(A, x)), st = Y.map(y => N.norm(y, P)), k = st.indexOf(Math.max(...st));
        const x = unitPt(th.value * Math.PI / 180, P), y = N.mv(A, x), R = Math.max(1.3, ...Y.flat().map(Math.abs)) * 1.1;
        plot.view(-R, R, -R, R).begin("", "").line(X.map(v => v[0]), X.map(v => v[1]), { color: "--c1", width: 2 }).line(Y.map(v => v[0]), Y.map(v => v[1]), { color: "--err", width: 2 });
        plot.seg(0, 0, Y[k][0], Y[k][1], { color: "--ink", width: 1.5, dash: [5, 4] });
        plot.arrow(0, 0, x[0], x[1], { color: "--c1", width: 3 }).arrow(0, 0, y[0], y[1], { color: "--err", width: 3 }).text(x[0], x[1], "x", { color: "--c1", bold: true, dx: 6, dy: -8, size: 13 }).text(y[0], y[1], "Ax", { color: "--err", bold: true, dx: 6, dy: -8, size: 13 });
        plot.note(`dashed: the longest A x, length ${fmt(st[k], 4)}`, { bold: true, color: "--ink" }).end();
        const deg = T.map(t => t * 180 / Math.PI), mx = Math.max(...st);
        plot2.view(0, 360, 0, Math.max(mx * 1.15, 0.5)).begin("angle of x (degrees)", "").line(deg, st, { color: "--err", width: 2 }).hline(mx, { color: "--ink", width: 1, dash: [5, 4] })
          .vline(th.value, { color: "--c1", width: 1.5 }).pts([th.value], [N.norm(y, P)], { color: "--c1", r: 5 }).note(`max = ‖A‖${p.value === "inf" ? "∞" : p.value} = ${fmt(mx, 4)}`, { bold: true, right: true, color: "--ink" }).end();
        const exact = N.matnorm(A, P), fro = N.matnorm(A, "fro");
        out.textContent = M2.lines(`‖x‖ = 1, ‖A x‖ = ${fmt(N.norm(y, P), 4)} (p = ${p.value === "inf" ? "∞" : p.value})`, `largest over the curve: ${fmt(mx, 5)}`, `exact ‖A‖_p:            ${fmt(exact, 5)}`,
          P === 1 ? `abs column sums: ${fmt(Math.abs(a) + Math.abs(c), 4)}, ${fmt(Math.abs(b) + Math.abs(d), 4)}` : P === Infinity ? `abs row sums: ${fmt(Math.abs(a) + Math.abs(b), 4)}, ${fmt(Math.abs(c) + Math.abs(d), 4)}` : "",
          `Frobenius ‖A‖ (book) = ${fmt(fro, 5)}`, `‖A‖₂ = ${fmt(N.matnorm(A, 2), 5)} ≤ Frobenius`);
        code.textContent = M2.lines(`A = np.array([[${fmt(a, 3)}, ${fmt(b, 3)}], [${fmt(c, 3)}, ${fmt(d, 3)}]])`, `np.linalg.norm(A)       # Frobenius (book)`, `np.linalg.norm(A, ${PN[p.value][2]})${p.value === "inf" ? "" : "     "}   # induced, p = ${p.value === "inf" ? "∞" : p.value}`);
      };
    },
  };

  /* ---------- 5. complexity ---------- */
  const OPS = {
    dot: ["inner product xᵀy (n-vectors)", n => 2 * n, "2n", "x @ y"],
    add: ["A + B (n × n)", n => n * n, "n²", "A + B"],
    mv: ["A x (n × n matrix)", n => 2 * n * n, "2n²", "A @ x"],
    gs: ["Gram–Schmidt, k vectors of length n", (n, k) => 2 * n * k * k, "2nk²", "gram_schmidt(a)"],
    mm: ["A B (n × n matrices, Lab 10)", n => 2 * n ** 3, "2n³", "A @ B"],
  };
  const tstr = s => s < 1e-6 ? fmt(s * 1e9, 3) + " ns" : s < 1e-3 ? fmt(s * 1e6, 3) + " µs" : s < 1 ? fmt(s * 1e3, 3) + " ms" : s < 120 ? fmt(s, 3) + " s" : s < 7200 ? fmt(s / 60, 3) + " min" : s < 172800 ? fmt(s / 3600, 3) + " hours" : fmt(s / 86400, 3) + " days";
  const complexity = {
    id: "complexity", title: "Counting flops",
    ref: "VMLS §1.5, §5.4, §6.5 · Lab 6, Part 4",
    desc: `<p>A <b>flop</b> is one floating point operation (+, −, ×, ÷). The <b>complexity</b> of an operation is its flop count as a function of the sizes.
      Dividing by the computer's speed (a few billion flops per second, Gflop/s) gives a rough run time. The plot uses log scales: a count like n² is a straight line with slope 2.
      What matters most is the power of n: doubling n multiplies the work by 2 for 2n, by 4 for 2n², by 8 for 2n³.</p>`,
    tries: ["For A x, double n. By what factor does the work grow?",
      "VMLS exercise 5.9: Gram–Schmidt with k = 1000, n = 10,000 takes about 2 seconds. Set those sizes and adjust the speed until the time is 2 s. Then estimate k = 500, n = 1000.",
      "At 1 Gflop/s, how large can n be for A x to take less than a second? For A B?",
      "Why is Gram–Schmidt quadratic in k but only linear in n?"],
    init(ctx) {
      const plot = ctx.plot("Flop counts (log–log scale); dots: your n and 2n", { aspect: "16 / 10", logx: true, logy: true });
      const op = UI.select({ label: "Operation", value: "mv", options: Object.entries(OPS).map(([k, v]) => [k, v[0]]) }, () => { k.el.hidden = op.value !== "gs"; ctx.redraw(); });
      const n = UI.slider({ label: "n", min: 10, max: 100000, log: true, step: 0.01, value: 1000, round: v => Math.round(+v.toPrecision(2)), fmt: v => v.toLocaleString() }, () => ctx.redraw());
      const k = UI.slider({ label: "k (number of vectors, Gram–Schmidt)", min: 10, max: 10000, log: true, step: 0.01, value: 100, round: v => Math.round(+v.toPrecision(2)), fmt: v => v.toLocaleString() }, () => ctx.redraw());
      const sp = UI.slider({ label: "computer speed (Gflop/s)", min: 0.1, max: 100, log: true, step: 0.01, value: 1, round: v => +v.toPrecision(2), fmt: v => fmt(v, 2) }, () => ctx.redraw());
      ctx.add(op, n, k, sp); k.el.hidden = true;
      const out = ctx.readout("Work and time"), code = M2.code(ctx);
      return () => {
        const nn = n.value, kk = k.value, o = OPS[op.value], f = o[1], F = f(nn, kk), F2 = f(2 * nn, kk), t = F / (sp.value * 1e9);
        plot.view(10, 2e5, 1, 1e16).begin("n", "flops");
        const C = { dot: "--c5", add: "--c2", mv: "--c1", gs: "--c7", mm: "--c6" }; let line = 0;
        for (const [key, v] of Object.entries(OPS)) {
          const on = key === op.value;
          plot.fn(z => v[1](z, kk), 10, 2e5, { color: C[key], width: on ? 3 : 1.3, alpha: on ? 1 : 0.45 });
          plot.note(`${v[2]}${key === "gs" ? ` (k = ${kk.toLocaleString()})` : ""}: ${v[0].split(" (")[0]}`, { color: C[key], bold: on, line: line++, size: 11 });
        }
        plot.pts([nn, 2 * nn], [F, F2], { color: C[op.value], r: 5 }).end();
        out.textContent = M2.lines(`${o[0]}`, `flops = ${o[2]} = ${F.toExponential(2).replace("e+", "e")}`, `at 2n: ${F2.toExponential(2).replace("e+", "e")}  (× ${fmt(F2 / F, 3)})`, `time at ${fmt(sp.value, 2)} Gflop/s ≈ ${tstr(t)}`, `time at 2n ≈ ${tstr(F2 / (sp.value * 1e9))}`);
        code.textContent = M2.lines("import time", `n = ${nn}`, op.value === "dot" ? "x = np.random.rand(n); y = np.random.rand(n)" : op.value === "gs" ? `a = list(np.random.rand(${kk}, n))` : "A = np.random.rand(n, n)" + (op.value === "mv" ? "; x = np.random.rand(n)" : "; B = np.random.rand(n, n)"),
          "t0 = time.perf_counter()", o[3], "print(time.perf_counter() - t0, 'seconds')");
      };
    },
  };

  UI.page(Object.assign({}, PAGE, { modules: [anatomy, matvec, bookm, induced, complexity] }));
})();
