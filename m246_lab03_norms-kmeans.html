<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab 3 demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a header, a wrapping row of module tabs, then the active module: plot column (left, wide) and
   control column (right); the description sits under the plot. One column on phones.
   Same visual language as the Ch 6-8 course tools (Okabe-Ito palette, Spline Sans + JetBrains Mono). */
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --ink: #1F2433; --muted: #5B6478; --line: #D9DEE7; --grid: #E8ECF2; --focus: #0072B2;
  --exact: #1F2433; --err: #D55E00; --hl: #FFF3D6;
  --c1: #0072B2; --c2: #E69F00; --c3: #009E73; --c4: #CC79A7; --c5: #56B4E9; --c6: #D55E00; --c7: #7A5195;
  --display: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font: 700 1.15rem/1.2 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0; font-size: 0.92rem }
a { color: var(--focus) }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px }
nav.tabs button { font: 500 0.88rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.module { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0 }
.plots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-width: 0 }
.plotbox { min-width: 0; grid-column: 1 / -1 }
.plotbox.half { grid-column: auto }
.ctrl > .matrix, .btns > .ctrl { justify-self: start }
.plotbox .cap { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
canvas { display: block; width: 100%; max-width: 100%; border-radius: 6px; touch-action: none }
.ctrls { display: grid; gap: 12px; align-content: start }
.ctrl { display: grid; gap: 4px }
.ctrl > label, .ctrl .lab { font-size: 0.88rem; display: flex; justify-content: space-between; gap: 10px }
.ctrl .val { font-family: var(--mono); font-variant-numeric: tabular-nums }
.ctrl input[type=range] { width: 100%; accent-color: var(--focus) }
select, input[type=number], input[type=text] { font: inherit; color: inherit; width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg) }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
button.b { font: 600 0.9rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer }
button.b.primary { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem }
.check input { accent-color: var(--focus); margin: 0 }
.matrix { display: inline-grid; gap: 4px; font-family: var(--mono) }
.matrix input { width: 5.4em; padding: 4px 5px; text-align: right; font-family: var(--mono); font-size: 0.85rem }
.readout { font-family: var(--mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; line-height: 1.45; max-height: 360px; overflow-y: auto }
.readout .hl { background: var(--hl) }
.readout table { border-collapse: collapse }
.readout td, .readout th { padding: 1px 8px; text-align: right; white-space: nowrap }
.readout th { color: var(--muted); font-weight: 600 }
.desc { font-size: 0.92rem; max-width: 75ch }
.desc p { margin: 0 0 8px }
.desc .ref { color: var(--muted); font-size: 0.85rem }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted) }
.legend span::before { content: ""; display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--c) }
footer { font-size: 0.8rem; color: var(--muted) }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
@media (max-width: 880px) { .module { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 560px) { .plotbox.half { grid-column: 1 / -1 } }

.readout.code { color: var(--ink); background: var(--hl) }
.plotbox .cap { text-transform: none; letter-spacing: 0; font-size: 0.85rem }

</style>
</head>

/* Lab 3 modules: p-norms and their unit circles, distance and nearest neighbors, angle and correlation,

(() => {
  const fmt = N.fmt, el = UI.el;

  /* ---------- distance and nearest neighbors ---------- */
  const ZS = [[2, 1], [7, 2], [5.5, 4], [4, 8], [1, 5], [9, 6]];

    desc: `<p>The distance between two vectors is the norm of their difference, dist(a, b) = ‖a − b‖. The <b>nearest neighbor</b> of x among z<sub>1</sub>, …, z<sub>m</sub> is the z<sub>j</sub> with the smallest distance.

        plot.view(-0.5, 10.5, -0.5, 9.5).begin("entry 1", "entry 2");

          const [a, b] = plot.inv(px + step / 2, py + step / 2); g.fillStyle = UI.css(GROUP[near([a, b])]); g.globalAlpha = 0.13; g.fillRect(px, py, step, step);
        }
        g.globalAlpha = 1;
        const j = near(x), ds = ZS.map(z => d(x, z));
        plot.seg(x[0], x[1], ZS[j][0], ZS[j][1], { color: "--ink", width: 2, dash: [5, 4] });
        ZS.forEach((z, i) => { plot.pts([z[0]], [z[1]], { color: GROUP[i], r: 7 }).text(z[0], z[1], `z${i + 1}`, { dx: 10, dy: -10, bold: true, color: "--ink" }); });
        const X = plot.X(x[0]), Y = plot.Y(x[1]); g.fillStyle = UI.css("--err"); g.fillRect(X - 7, Y - 7, 14, 14); g.strokeStyle = UI.css("--surface"); g.lineWidth = 2; g.strokeRect(X - 7, Y - 7, 14, 14);
        plot.note(`nearest neighbor of x: z${j + 1}`, { color: "--ink", bold: true }).note("drag x", { color: "--err", right: true }).end();
        out.textContent = M2.lines(`x = ${M2.vec(x)}`, ...ds.map((v, i) => `dist(x, z${i + 1}) = ${fmt(v, 4).padStart(7)}${i === j ? "  ← nearest" : ""}`));
        const sx = s === 1 ? "" : `S = np.array([${fmt(s, 3)}, 1])   # units of entry 1\n`;
        code.textContent = M2.lines("Zs = np.array([[2, 1], [7, 2], [5.5, 4],", "               [4, 8], [1, 5], [9, 6]])", `x = np.array([${x.map(v => fmt(v, 3)).join(", ")}])`,
          sx + `D = ${s === 1 ? "Zs - x" : "(Zs - x) * S"}`, `dists = np.linalg.norm(D, ord=${pPy(p)}, axis=1)`, "j = np.argmin(dists)   # Python counts from 0");

  /* ---------- angle and correlation ---------- */
  const angleCorr = {
    id: "angle-correlation", title: "Angle, std and correlation",

    desc: `<p>Two time series a and b with 50 samples are two 50-vectors. Their <b>angle</b> is ∠(a, b) = arccos(aᵀb / (‖a‖ ‖b‖)).

  const images = {
    id: "image-vectors", title: "Images as vectors",
    ref: "VMLS §3.2, §3.4 · Lab 3, Part 3",
    desc: `<p>A color image with 160 × 160 pixels stores a red, green and blue value for every pixel, so each pixel is a <b>3-vector</b> and the whole image is one vector

    tries: ["Set the noise to 0 and lower α. The distance grows, but what happens to the angle? Why?",

        code.textContent = M2.lines("x = img.flatten() / 255   # long vector", `noise = rng.standard_normal(x.size)`, `y = np.clip(${fmt(A, 3)} * x + ${fmt(S, 3)} * noise, 0, 1)`,
          "d = np.linalg.norm(x - y)", "rms_error = d / np.sqrt(x.size)", "", "pixels = img.reshape(-1, 3) / 255  # N x 3", `norms = np.linalg.norm(pixels, ord=${pPy(p)},`, "                       axis=1)  # per row");

  /* ---------- k-means helpers ---------- */
  const dist2 = (u, v) => { let s = 0; for (let i = 0; i < u.length; i++) s += (u[i] - v[i]) ** 2; return s; };
  function assign(X, Z) { const c = new Int32Array(X.length); let J = 0; X.forEach((x, i) => { let b = 0, bd = Infinity; Z.forEach((z, j) => { const d = dist2(x, z); if (d < bd) { bd = d; b = j; } }); c[i] = b; J += bd; }); return { c, J: J / X.length }; }
  function update(X, c, Z) { const n = X[0].length, S = Z.map(() => new Array(n).fill(0)), cnt = Z.map(() => 0); X.forEach((x, i) => { cnt[c[i]]++; for (let d = 0; d < n; d++) S[c[i]][d] += x[d]; }); return Z.map((z, j) => cnt[j] ? S[j].map(v => v / cnt[j]) : z.slice()); }
  function pickK(N0, k, rng) { const idx = [...Array(N0).keys()]; for (let i = 0; i < k; i++) { const j = i + Math.floor(rng() * (N0 - i)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx.slice(0, k); }

  /* ---------- k-means step by step ---------- */
  const kmeans = {
    id: "kmeans", title: "k-means step by step",
    ref: "VMLS §4.1–4.3 · Lab 3, Part 4",
    desc: `<p><b>k-means</b> groups N vectors into k clusters. It keeps a representative z<sub>j</sub> (square with a black border) for every group and repeats two steps:</p>
      <ol><li><b>Assign:</b> each x<sub>i</sub> joins the group of its nearest representative.</li><li><b>Update:</b> each z<sub>j</sub> moves to the mean (centroid) of its group.</li></ol>
      <p>The quality of a clustering is J<sup>clust</sup> = (1/N)(‖x<sub>1</sub> − z<sub>c<sub>1</sub></sub>‖² + ⋯ + ‖x<sub>N</sub> − z<sub>c<sub>N</sub></sub>‖²), the mean squared distance to the assigned representative.
      Each step can only lower J<sup>clust</sup>, so it never increases (lower plot). The algorithm stops when the assignment no longer changes.</p>`,
    tries: ["Press 'next step' a few times and watch the squares move. When does it stop?",
      "With k = 3, press 'new start' and 'run to the end' several times. Do you always get the same final J?",
      "Now do the same with k = 5. Is there one 'right' answer? Which run would you keep?",
      "Make the spread large. How does that change the final J?"],
    init(ctx) {
      const plot = ctx.plot("Data vectors xᵢ (colored by group) and representatives zⱼ (squares)", { aspect: "16 / 11" });
      const jp = ctx.plot("Jᶜˡᵘˢᵗ after each assign step", { aspect: "16 / 5" });
      const k = UI.slider({ label: "k (number of groups)", min: 1, max: 8, step: 1, value: 3, fmt: v => v }, () => { restart(); ctx.redraw(); });
      const sp = UI.slider({ label: "spread of the three true groups", min: 0.3, max: 2.5, step: 0.1, value: 1, fmt: v => fmt(v, 2) }, () => { makeData(); restart(); ctx.redraw(); });
      let dseed = 7, iseed = 1, X, Z, c, J, phase, Jh, done;
      function makeData() {
        const rng = N.rng(dseed), mu = [[0, 0], [5, 5], [6, -1]], sd = [[1, 2], [1.4, 1], [0.7, 0.7]]; X = [];
        for (let g = 0; g < 3; g++) for (let i = 0; i < 100; i++) X.push([mu[g][0] + sp.value * sd[g][0] * M2.randn(rng), mu[g][1] + sp.value * sd[g][1] * M2.randn(rng)]);
      }
      function restart() { const rng = N.rng(1000 + iseed); Z = pickK(X.length, k.value, rng).map(i => X[i].slice()); c = null; J = null; Jh = []; phase = "start"; done = false; }
      function step() {
        if (done) return;
        if (phase === "update" || phase === "start") { const r = assign(X, Z); if (c && r.c.every((v, i) => v === c[i])) { done = true; } c = r.c; J = r.J; if (!done) Jh.push(J); phase = "assign"; }
        else { Z = update(X, c, Z); J = assign(X, Z).J; phase = "update"; }
      }
      makeData(); restart();
      ctx.add(k, sp, UI.buttons([["next step", () => { step(); ctx.redraw(); }, true], ["run to the end", () => { for (let i = 0; i < 400 && !done; i++) step(); ctx.redraw(); }]]),
        UI.buttons([["new start", () => { iseed++; restart(); ctx.redraw(); }], ["new data", () => { dseed++; makeData(); restart(); ctx.redraw(); }]]));
      const out = ctx.readout("State"), code = M2.code(ctx);
      return () => {
        const [x0, x1] = UI.range(X.map(p => p[0]), 0.05), [y0, y1] = UI.range(X.map(p => p[1]), 0.05);
        plot.view(x0, x1, y0, y1).begin("entry 1", "entry 2");
        if (!c) plot.pts(X.map(p => p[0]), X.map(p => p[1]), { color: "--muted", r: 3 });
        else for (let j = 0; j < Z.length; j++) { const idx = X.map((_, i) => i).filter(i => c[i] === j); plot.pts(idx.map(i => X[i][0]), idx.map(i => X[i][1]), { color: GROUP[j], r: 3 }); }
        const g = plot.g; Z.forEach((z, j) => { const X0 = plot.X(z[0]), Y0 = plot.Y(z[1]); g.fillStyle = UI.css(GROUP[j]); g.fillRect(X0 - 8, Y0 - 8, 16, 16); g.strokeStyle = UI.css("--ink"); g.lineWidth = 2.5; g.strokeRect(X0 - 8, Y0 - 8, 16, 16); });
        const msg = done ? "done: the assignment did not change" : phase === "start" ? "start: k random data points as representatives" : phase === "assign" ? "step 1 done: each point joined its nearest square" : "step 2 done: each square moved to its group mean";
        plot.note(msg, { color: "--ink", bold: true }).end();
        const nI = Math.max(Jh.length, 2), [j0, j1] = UI.range([Jh, [0]], 0.1, [0, 1]);
        jp.view(0.5, nI + 0.5, 0, Math.max(j1, 1e-9)).begin("iteration", "J");
        if (Jh.length) jp.line(Jh.map((_, i) => i + 1), Jh, { color: "--c1" }).pts(Jh.map((_, i) => i + 1), Jh, { color: "--c1", r: 4 });
        jp.end();
        const sizes = Z.map((_, j) => c ? c.filter(v => v === j).length : 0);
        out.textContent = M2.lines(`N = ${X.length} vectors in R², k = ${k.value}`, `assign steps so far: ${Jh.length}`, J != null ? `J_clust = ${fmt(J, 5)}` : "J_clust: not yet (no assignment)", c ? `group sizes: ${sizes.join(", ")}` : "", done ? "converged ✓" : "");
        code.textContent = M2.lines("# step 1: assign", `D = np.zeros((N, ${k.value}))`, `for j in range(${k.value}):`, "    D[:, j] = np.linalg.norm(X - Z[j], axis=1)", "c = np.argmin(D, axis=1)",
          "J = np.mean(np.min(D, axis=1)**2)", "# step 2: update", `for j in range(${k.value}):`, "    Z[j] = X[c == j].mean(axis=0)");
      };
    },
  };

  /* ---------- k-means on image colors ---------- */
  const colors = {
    id: "color-quantization", title: "k-means on image colors",
    ref: "VMLS §4.4 · Lab 3, Part 4",
    desc: `<p>Every pixel of the astronaut image is a 3-vector (R, G, B), so the image gives N = 25,600 vectors in R³. Running k-means on them finds
      k <b>representative colors</b>. Replacing every pixel by its representative gives an image that uses only k colors (<b>color quantization</b>).
      The scatter plot shows 1500 pixels seen from the blue axis (red against green), with the representatives as squares.</p>
      <p>Storing the result takes the k colors plus one group number per pixel: log₂ k bits instead of 24 bits per pixel.</p>`,
    tries: ["Start with k = 2. Which two colors does k-means pick? Then try k = 4, 8, 16.",
      "Set the iterations to 0: the representatives are just k random pixels. How much better is the image after 10 iterations?",
      "Read off J for k = 2, 4, 8, 16. Why does it always go down as k grows?",
      "How many bits per pixel does k = 8 need? What fraction of the original 24 bits is that?"],
    init(ctx) {
      const a = M2.imgBox(ctx, "Original (160 × 160)", true), b = M2.imgBox(ctx, "Quantized", true);
      const sc = ctx.plot("Pixels in the RGB cube (red vs green)", { aspect: "1 / 1", half: true, equal: true });
      const jp = ctx.plot("Jᶜˡᵘˢᵗ by iteration", { aspect: "1 / 1", half: true });
      const pal = ctx.canvas("The k representative colors");
      const k = UI.slider({ label: "k (number of colors)", min: 2, max: 16, step: 1, value: 4, fmt: v => v }, () => ctx.redraw());
      const it = UI.slider({ label: "iterations", min: 0, max: 25, step: 1, value: 25, fmt: v => v }, () => ctx.redraw());
      let seed = 1; ctx.add(k, it, UI.buttons([["new random start", () => { seed++; ctx.redraw(); }]]));
      const out = ctx.readout("Result"), code = M2.code(ctx);
      let im = null, X = null, sample = null, cache = {};
      M2.image().then(v => { im = v; X = Array.from({ length: v.w * v.h }, (_, i) => [v.R[i], v.G[i], v.B[i]]); const rng = N.rng(5); sample = pickK(X.length, 1500, rng); ctx.redraw(); });
      function run(kk) {
        const key = kk + ":" + seed; if (cache[key]) return cache[key];
        let Z = pickK(X.length, kk, N.rng(seed * 101 + kk)).map(i => X[i].slice()); const Zs = [Z], Js = [];
        let r = assign(X, Z); Js.push(r.J);
        for (let t = 0; t < 25; t++) { Z = update(X, r.c, Z); const r2 = assign(X, Z); Zs.push(Z); Js.push(r2.J); r = r2; }
        return cache[key] = { Zs, Js };
      }
      return () => {
        if (!im) return; const kk = k.value, R = run(kk), t = it.value, Z = R.Zs[t], { c, J } = assign(X, Z), n = X.length;
        const Q = { w: im.w, h: im.h, R: new Float64Array(n), G: new Float64Array(n), B: new Float64Array(n) };
        for (let i = 0; i < n; i++) { const z = Z[c[i]]; Q.R[i] = z[0]; Q.G[i] = z[1]; Q.B[i] = z[2]; }
        M2.showImage(a, im); M2.showImage(b, Q); b.capEl.textContent = `Quantized: k = ${kk} colors, ${t} iterations`;
        const rgb = v => `rgb(${v.map(q => Math.round(255 * Math.max(0, Math.min(1, q)))).join(",")})`;
        sc.view(0, 1, 0, 1).begin("red", "green");
        for (const i of sample) sc.pts([X[i][0]], [X[i][1]], { color: rgb(X[i]), r: 2.5 });
        const g = sc.g; Z.forEach(z => { const X0 = sc.X(z[0]), Y0 = sc.Y(z[1]); g.fillStyle = rgb(z); g.fillRect(X0 - 8, Y0 - 8, 16, 16); g.strokeStyle = UI.css("--ink"); g.lineWidth = 2.5; g.strokeRect(X0 - 8, Y0 - 8, 16, 16); });
        sc.end();
        const Js = R.Js, ji = Js.map((_, i) => i);
        jp.view(-0.5, 25.5, 0, Math.max(...Js) * 1.08).begin("iteration", "J").line(ji, Js, { color: "--muted", width: 1.2 }).pts([t], [Js[t]], { color: "--err", r: 6 }).note(`J = ${fmt(Js[t], 4)}`, { right: true, bold: true, color: "--ink" }).end();
        const r = pal.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, W = Math.max(10, r.width), H = 58;
        pal.style.aspectRatio = "auto"; pal.style.height = H + "px"; pal.width = Math.round(W * dpr); pal.height = Math.round(H * dpr);
        const pg = pal.getContext("2d"); pg.setTransform(dpr, 0, 0, dpr, 0, 0); pg.fillStyle = UI.css("--surface"); pg.fillRect(0, 0, W, H);
        const sw = Math.min(70, (W - 4) / kk), cnt = Z.map((_, j) => 0); for (let i = 0; i < n; i++) cnt[c[i]]++;
        Z.forEach((z, j) => { pg.fillStyle = rgb(z); pg.fillRect(2 + j * sw, 2, sw - 4, 34); pg.strokeStyle = UI.css("--line"); pg.strokeRect(2 + j * sw + 0.5, 2.5, sw - 5, 33);
          pg.fillStyle = UI.css("--muted"); pg.font = `11px ${UI.css("--mono")}`; pg.textAlign = "center"; pg.textBaseline = "top"; pg.fillText(`${Math.round(100 * cnt[j] / n)}%`, 2 + j * sw + sw / 2 - 2, 40); });
        const bits = Math.ceil(Math.log2(kk));
        out.textContent = M2.lines(`N = ${n.toLocaleString()} pixel vectors in R³`, `J_clust = ${fmt(J, 4)}`, `RMS error = √(J/3) = ${fmt(Math.sqrt(J / 3), 4)}`,
          `storage: ${bits} bits per pixel (+ ${kk} colors)`, `vs 24 bits per pixel: ${fmt(100 * bits / 24, 3)}%`, "", "representatives (0–255):", ...Z.slice(0, 8).map((z, j) => `z${j + 1} = (${z.map(q => Math.round(255 * q)).join(", ")})`), kk > 8 ? "…" : "");
        code.textContent = M2.lines("pix = img.reshape(-1, 3) / 255  # N x 3", `c, Z, J_hist = kmeans(pix, ${kk})`, "quant = Z[c]     # each pixel -> its color", "plt.imshow(quant.reshape(H, W, 3))");
      };
    },
  };

  UI.page(Object.assign({}, PAGE, { modules: [unitBalls, nearest, angleCorr, images, kmeans, colors] }));
})();

</script>
