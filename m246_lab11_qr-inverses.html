<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab 11 demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a header, a wrapping row of module tabs, then the active module: plot column (left, wide) and
   control column (right); the description sits under the plot. One column on phones.
   Same visual language as the Ch 6-8 course tools (Okabe-Ito palette, Spline Sans + JetBrains Mono). */
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --ink: #1F2433; --muted: #5B6478; --line: #D9DEE7; --grid: #E8ECF2; --focus: #0072B2;
  --exact: #1F2433; --err: #D55E00; --hl: #FFF3D6;
  --c1: #0072B2; --c2: #E69F00; --c3: #009E73; --c4: #CC79A7; --c5: #56B4E9; --c6: #D55E00; --c7: #7A5195;
  --display: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font: 700 1.15rem/1.2 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0; font-size: 0.92rem }
a { color: var(--focus) }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px }
nav.tabs button { font: 500 0.88rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.module { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0 }
.plots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-width: 0 }
.plotbox { min-width: 0; grid-column: 1 / -1 }
.plotbox.half { grid-column: auto }
.ctrl > .matrix, .btns > .ctrl { justify-self: start }
.plotbox .cap { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
canvas { display: block; width: 100%; max-width: 100%; border-radius: 6px; touch-action: none }
.ctrls { display: grid; gap: 12px; align-content: start }
.ctrl { display: grid; gap: 4px }
.ctrl > label, .ctrl .lab { font-size: 0.88rem; display: flex; justify-content: space-between; gap: 10px }
.ctrl .val { font-family: var(--mono); font-variant-numeric: tabular-nums }
.ctrl input[type=range] { width: 100%; accent-color: var(--focus) }
select, input[type=number], input[type=text] { font: inherit; color: inherit; width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg) }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
button.b { font: 600 0.9rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer }
button.b.primary { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem }
.check input { accent-color: var(--focus); margin: 0 }
.matrix { display: inline-grid; gap: 4px; font-family: var(--mono) }
.matrix input { width: 5.4em; padding: 4px 5px; text-align: right; font-family: var(--mono); font-size: 0.85rem }
.readout { font-family: var(--mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; line-height: 1.45; max-height: 360px; overflow-y: auto }
.readout .hl { background: var(--hl) }
.readout table { border-collapse: collapse }
.readout td, .readout th { padding: 1px 8px; text-align: right; white-space: nowrap }
.readout th { color: var(--muted); font-weight: 600 }
.desc { font-size: 0.92rem; max-width: 75ch }
.desc p { margin: 0 0 8px }
.desc .ref { color: var(--muted); font-size: 0.85rem }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted) }
.legend span::before { content: ""; display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--c) }
footer { font-size: 0.8rem; color: var(--muted) }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
@media (max-width: 880px) { .module { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 560px) { .plotbox.half { grid-column: 1 / -1 } }

.readout.code { color: var(--ink); background: var(--hl) }
.plotbox .cap { text-transform: none; letter-spacing: 0; font-size: 0.85rem }

</style>
</head>

        else if (k === 1) what = [`c = Qᵀ b = ${M2.vec(c, 4)}`, "about 2n² flops.", "(the x column is shown as 0 until it is found)"];
        else { const i = cur, terms = []; const pf = v => v < 0 ? `(${fmt(v, 4)})` : fmt(v, 4); for (let j = i + 1; j < 3; j++) terms.push(`${pf(R[i][j])}·${pf(x[j])}`);
          what = [`row ${i + 1}: R${i + 1}${i + 1}·x${i + 1}${terms.length ? " + (terms with known x's)" : ""} = c${i + 1}`, `x${i + 1} = (${fmt(c[i], 4)}${terms.length ? " − " + terms.join(" − ") : ""}) / ${fmt(R[i][i], 4)}`, `   = ${fmt(x[i], 6)}`]; }
        const xs2 = N.solve(A, b);
        out.textContent = M2.lines(what, "", `x = (${xs.join(", ")})`, k === 4 ? `np.linalg.solve gives ${M2.vec(xs2, 6)}` : "");
        code.textContent = M2.lines("Q, R = qr_gs(A)", "c = Q.T @ b", "x = back_sub(R, c)", "print(np.linalg.solve(A, b))   # same x");
      };
    },
  };

  /* ---------- round-off: Hilbert matrices ---------- */
  const hilbert = n => Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => 1 / (i + j + 1)));
  const randomM = n => { const r = N.rng(246 + n); return Array.from({ length: n }, () => Array.from({ length: n }, () => M2.randn(r))); };
  const roundoff = {
    id: "roundoff", title: "Round-off: Hilbert matrices",
    ref: "VMLS §10.4, §11.3 · Lab 11, Parts 1–2",
    desc: `<p>The Hilbert matrix H (entries 1/(i + j − 1), Lab 10) has columns that are <b>nearly dependent</b>; its condition number κ(H) grows like 10<sup>1.5n</sup>.
      Computers round every number to about 16 digits, and the rounding errors get amplified by up to κ(H).</p>
      <p><b>Orthogonality of Q:</b> how far the computed Q is from QᵀQ = I for classical Gram–Schmidt (our qr_gs), modified Gram–Schmidt, and Householder QR (np.linalg.qr).
      <b>Error in x:</b> solve Hx = b with true answer x = (1, …, 1) by inv(H) @ b, np.linalg.solve (LU), and QR + back substitution with NumPy's QR or with our qr_gs.
      The dashed line is κ(H) × 10<sup>−16</sup>, the error a good method should get. Everything is computed live in your browser with the same 16-digit numbers NumPy uses.</p>`,
    tries: ["Orthogonality: at what n is the Q from classical Gram–Schmidt useless (‖QᵀQ − I‖ near 1)? What about Householder?",
      "Error in x: which solvers follow the dashed line? Why is qr_gs + back_sub so much worse? (Look at the orthogonality of its Q.)",
      "Switch to random matrices. Is there any problem now? So is it the method's fault or the matrix's?"],
    init(ctx) {
      const plot = ctx.plot("Log scale: 10⁰ = useless, 10⁻¹⁶ = perfect", { aspect: "16 / 10", logy: true });
      const what = UI.select({ label: "Measure", value: "orth", options: [["orth", "orthogonality of Q: ‖QᵀQ − I‖"], ["err", "error in x for H x = b"]] }, () => ctx.redraw());
      const kind = UI.select({ label: "Matrix", value: "hilb", options: [["hilb", "Hilbert matrix H (ill conditioned)"], ["rand", "random matrix (well conditioned)"]] }, () => ctx.redraw());
      const nsl = UI.slider({ label: "n (highlighted)", min: 2, max: 13, step: 1, value: 8, fmt: v => v }, () => ctx.redraw());
      ctx.add(what, kind, nsl); const out = ctx.readout("Values at the highlighted n"), code = M2.code(ctx);
      const cache = {};
      const data = (k) => {
        if (cache[k]) return cache[k];
        const rows = [];
        for (let n = 2; n <= 13; n++) {
          const H = k === "hilb" ? hilbert(n) : randomM(n), I = N.eye(n), dev = Q => fro(N.add(N.mm(N.T(Q), Q).flat(), I.flat(), -1).map(v => [v]));
          const one = new Array(n).fill(1), b = N.mv(H, one), err = x => x && x.every(Number.isFinite) ? Math.max(1e-17, N.norm(N.add(x, one, -1)) / Math.sqrt(n)) : NaN;
          const hh = N.householderQR(H), xqr = N.usolve(hh.R, N.mv(N.T(hh.Q), b)), Hi = N.inv(H);
          const gs = N.gramSchmidt(H, false), xgs = N.usolve(gs.R, N.mv(N.T(gs.Q), b));
          rows.push({ n, cond: N.cond(H), orth: [dev(gs.Q), dev(N.gramSchmidt(H, true).Q), dev(hh.Q)].map(v => Math.max(1e-17, v)),
            err: [err(Hi && N.mv(Hi, b)), err(N.solve(H, b)), err(xqr), err(xgs)] });
        }
        return cache[k] = rows;
      };
      return () => {
        const rows = data(kind.value), m = what.value, ns = rows.map(r => r.n), names = m === "orth" ? ["classical GS (qr_gs)", "modified GS", "Householder (np.linalg.qr)"] : ["inv(H) @ b", "np.linalg.solve (LU)", "np.linalg.qr + back_sub", "qr_gs + back_sub"];
        const cols = m === "orth" ? ["--c2", "--c4", "--c1"] : ["--c4", "--c1", "--c3", "--c2"];
        plot.view(2, 13, 1e-17, 1e3).begin("n", m === "orth" ? "‖QᵀQ − I‖" : "relative error in x");
        plot.line(ns, rows.map(r => Math.min(1e3, Math.max(1e-17, r.cond * 1.1e-16))), { color: "--exact", width: 1.5, dash: [6, 4] });
        names.forEach((nm, k) => plot.line(ns, rows.map(r => r[m][k]), { color: cols[k], width: 2.2 }).pts(ns, rows.map(r => r[m][k]), { color: cols[k], r: 3.5 }).note(nm, { color: cols[k], bold: true, line: k }));
        plot.note("κ × 10⁻¹⁶ (dashed)", { line: names.length, bold: true });
        plot.vline(nsl.value, { color: "--muted", width: 1, dash: [3, 3] }).end();
        const r = rows[nsl.value - 2];
        out.textContent = M2.lines(`n = ${r.n}, κ = ${fmt(r.cond, 3)}`, ...names.map((nm, k) => `${nm.padEnd(26)} ${fmt(r[m][k], 2)}`));
        const mk = kind.value === "hilb" ? `H = hilbert(${r.n})` : `H = rng.standard_normal((${r.n}, ${r.n}))`;
        code.textContent = m === "orth" ? M2.lines(mk, "Q, R = qr_gs(H)", `print(np.linalg.norm(Q.T @ Q - np.eye(${r.n})))`, "Q, R = np.linalg.qr(H)", `print(np.linalg.norm(Q.T @ Q - np.eye(${r.n})))`)
          : M2.lines(mk, `b = H @ np.ones(${r.n})`, "x = np.linalg.solve(H, b)", "x2 = solve_qr(H, b)         # uses qr_gs", "print(np.linalg.norm(x - 1), np.linalg.norm(x2 - 1))", "print(np.linalg.cond(H))");
      };
    },
  };

  /* ---------- undoing a transformation of an image ---------- */
  const EXT = 1.5, SZ = 240;
  /** Image of src under the map p -> M p, sampled on an SZ x SZ grid over [-EXT, EXT]^2. src = {w, h, ext, R, G, B}. Minv maps output points back to src. */
  function warp(src, Minv) {
    const out = { w: SZ, h: SZ, ext: EXT, R: new Float64Array(SZ * SZ), G: new Float64Array(SZ * SZ), B: new Float64Array(SZ * SZ) };
    for (let i = 0; i < SZ; i++) for (let j = 0; j < SZ; j++) {
      const px = -EXT + (j + 0.5) * 2 * EXT / SZ, py = EXT - (i + 0.5) * 2 * EXT / SZ;
      const qx = Minv[0][0] * px + Minv[0][1] * py, qy = Minv[1][0] * px + Minv[1][1] * py;
      const c = Math.floor((qx + src.ext) / (2 * src.ext) * src.w), r = Math.floor((src.ext - qy) / (2 * src.ext) * src.h), k = i * SZ + j;
      if (c >= 0 && c < src.w && r >= 0 && r < src.h) { const s = r * src.w + c; out.R[k] = src.R[s]; out.G[k] = src.G[s]; out.B[k] = src.B[s]; }
      else out.R[k] = out.G[k] = out.B[k] = 0.93;
    }
    return out;
  }
  /** Forward splat (for a singular M): every source pixel lands at M q. */
  function splat(src, M) {
    const out = { w: SZ, h: SZ, ext: EXT, R: new Float64Array(SZ * SZ).fill(0.93), G: new Float64Array(SZ * SZ).fill(0.93), B: new Float64Array(SZ * SZ).fill(0.93) };
    for (let r = 0; r < src.h; r++) for (let c = 0; c < src.w; c++) {
      const qx = -src.ext + (c + 0.5) * 2 * src.ext / src.w, qy = src.ext - (r + 0.5) * 2 * src.ext / src.h;
      const px = M[0][0] * qx + M[0][1] * qy, py = M[1][0] * qx + M[1][1] * qy, j = Math.floor((px + EXT) / (2 * EXT) * SZ), i = Math.floor((EXT - py) / (2 * EXT) * SZ);
      if (j >= 0 && j < SZ && i >= 0 && i < SZ) { const k = i * SZ + j, s = r * src.w + c; out.R[k] = src.R[s]; out.G[k] = src.G[s]; out.B[k] = src.B[s]; }
    }
    return out;
  }
  const undo = {
    id: "undo-transform", title: "Undoing a transformation",
    ref: "VMLS §7.1, §11.2 · Lab 11, Part 3",
    desc: `<p>The 2 × 2 matrix T = R(θ) · Sh(k) · diag(s₁, s₂) first stretches by s₁ and s₂, then shears, then rotates (Lab 7). Applied to every pixel position, it moves the picture (second picture).
      If T is invertible, T<sup>−1</sup> = diag(1/s₁, 1/s₂) · Sh(−k) · R(−θ) undoes the steps <b>in reverse order</b> and moves the picture back (third picture).</p>
      <p>The picture is stored with a fixed number of pixels. If T squashes it (s₂ near 0), detail is lost in the second picture and T<sup>−1</sup> cannot bring it back.
      If s₂ = 0, T is a projection: det T = 0 and there is no inverse at all.</p>`,
    tries: ["Rotate and stretch. Does T⁻¹ bring the astronaut back exactly? Where is it imperfect (look at the corners)?",
      "Check the reverse order: compare the matrix T⁻¹ with the product written in the readout.",
      "Move s₂ toward 0. Watch det T, the size of the entries of T⁻¹ and the third picture.",
      "Set the shear k = 1 and everything else neutral. What is T⁻¹? Guess first."],
    init(ctx) {
      const a = M2.imgBox(ctx, "Original X", true), b = M2.imgBox(ctx, "T applied", true), c = M2.imgBox(ctx, "T⁻¹ applied to the second picture", true);
      const cv = ctx.canvas("T, T⁻¹ and T⁻¹ T"); cv.box.classList.add("half");
      const th = UI.slider({ label: "θ (rotation, degrees)", min: -180, max: 180, step: 5, value: 30, fmt: v => v + "°" }, () => ctx.redraw());
      const k = UI.slider({ label: "k (shear)", min: -1.5, max: 1.5, step: 0.05, value: 0, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      const s1 = UI.slider({ label: "s₁ (stretch in x)", min: 0, max: 1.5, step: 0.05, value: 0.5, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      const s2 = UI.slider({ label: "s₂ (stretch in y)", min: 0, max: 1.5, step: 0.05, value: 1.2, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      const set = (a1, a2, a3, a4) => { th.value = a1; k.value = a2; s1.value = a3; s2.value = a4; ctx.redraw(); };
      ctx.add(UI.buttons([["Lab 11: R S", () => set(30, 0, 0.5, 1.2)], ["shear", () => set(0, 1, 1, 1)], ["nearly flat", () => set(30, 0, 1, 0.1)], ["projection", () => set(30, 0, 1, 0)]]), th, k, s1, s2);
      const out = ctx.readout("det, inverse, reverse order"), code = M2.code(ctx);
      let im = null; M2.image().then(v => { im = Object.assign(v, { ext: 1 }); ctx.redraw(); });
      return () => {
        if (!im) return;
        const t = th.value * deg, T = N.mm(N.mm(rot(t), [[1, k.value], [0, 1]]), [[s1.value, 0], [0, s2.value]]), d = T[0][0] * T[1][1] - T[0][1] * T[1][0], inv = Math.abs(d) > 1e-9;
        const Ti = inv ? [[T[1][1] / d, -T[0][1] / d], [-T[1][0] / d, T[0][0] / d]] : null;
        const X0 = warp(im, N.eye(2)), X1 = inv ? warp(im, Ti) : splat(im, T);
        const w = a.getBoundingClientRect().width;
        M2.showImage(a, X0); M2.showImage(b, X1, { maxH: w });
        if (inv) { M2.showImage(c, warp(X1, T), { maxH: w }); c.capEl.textContent = "T⁻¹ applied to the second picture"; }
        else { M2.showImage(c, { w: 1, h: 1, gray: [0.93] }, { maxH: w }); c.capEl.textContent = "T is singular: nothing can undo it"; }
        b.capEl.textContent = `T applied (areas × ${fmt(Math.abs(d), 3)})`;
        UI.drawMats(cv, [{ M: T, title: "T", d: 3 }, ...(inv ? [{ M: Ti, title: "T⁻¹", d: 3, hl: (i, j) => Math.abs(Ti[i][j]) > 5 ? "--err" : null }, { M: N.mm(Ti, T).map(r => r.map(v => Math.abs(v) < 1e-12 ? 0 : v)), title: "T⁻¹ T", d: 3 }] : [])], { cell: 64 });
        out.textContent = M2.lines(`det T = s₁·s₂ = ${fmt(d, 4)}`, inv ? `T⁻¹ = diag(1/s₁, 1/s₂) · Sh(${fmt(-k.value, 3)}) · R(${-th.value}°)` : "det T = 0: T is not invertible",
          inv ? `largest entry of T⁻¹: ${fmt(Math.max(...Ti.flat().map(Math.abs)), 4)}` : "many points land on the same point", inv ? `condition number κ(T) = ${fmt(N.cond(T), 4)}` : "");
        code.textContent = M2.lines(`Rot = rotation(np.radians(${th.value}))`, `Sh = np.array([[1, ${fmt(k.value, 3)}], [0, 1]])`, `S = np.diag([${fmt(s1.value, 3)}, ${fmt(s2.value, 3)}])`, "T = Rot @ Sh @ S",
          inv ? "T_inv = np.linalg.inv(T)" : "np.linalg.inv(T)      # LinAlgError: singular", inv ? "back = np.linalg.inv(S) @ np.linalg.inv(Sh) @ Rot.T\nprint(np.allclose(T_inv, back))   # reverse order" : "");
      };
    },
  };

  UI.page(Object.assign({}, PAGE, { modules: [leftInv, qrPicture, solveQR, roundoff, undo] }));
})();

</script>
