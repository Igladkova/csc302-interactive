<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interpolation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a header, a wrapping row of module tabs, then the active module: plot column (left, wide) and
   control column (right); the description sits under the plot. One column on phones.
   Same visual language as the Ch 6-8 course tools (Okabe-Ito palette, Spline Sans + JetBrains Mono). */
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --ink: #1F2433; --muted: #5B6478; --line: #D9DEE7; --grid: #E8ECF2; --focus: #0072B2;
  --exact: #1F2433; --err: #D55E00; --hl: #FFF3D6;
  --c1: #0072B2; --c2: #E69F00; --c3: #009E73; --c4: #CC79A7; --c5: #56B4E9; --c6: #D55E00; --c7: #7A5195;
  --display: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Spline Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1A2130; --ink: #E6EAF2; --muted: #9AA4B8; --line: #2D3648; --grid: #232B3B; --focus: #56B4E9;
  --exact: #E6EAF2; --err: #FF8A4C; --hl: #3A3220;
  --c1: #56B4E9; --c2: #F5B935; --c3: #2DC79A; --c4: #E39BC4; --c5: #9ED8F6; --c6: #FF8A4C; --c7: #B79AE0; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font: 700 1.15rem/1.2 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0; font-size: 0.92rem }
a { color: var(--focus) }
.nav { font-size: 1.08rem; font-weight: 500 }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px }
nav.tabs button { font: 500 0.88rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.module { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0 }
.plots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-width: 0 }
.plotbox { min-width: 0; grid-column: 1 / -1 }
.plotbox.half { grid-column: auto }
.ctrl > .matrix, .btns > .ctrl { justify-self: start }
.plotbox .cap { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
canvas { display: block; width: 100%; max-width: 100%; border-radius: 6px; touch-action: none }
.ctrls { display: grid; gap: 12px; align-content: start }
.ctrl { display: grid; gap: 4px }
.ctrl > label, .ctrl .lab { font-size: 0.88rem; display: flex; justify-content: space-between; gap: 10px }
.ctrl .val { font-family: var(--mono); font-variant-numeric: tabular-nums }
.ctrl input[type=range] { width: 100%; accent-color: var(--focus) }
select, input[type=number], input[type=text] { font: inherit; color: inherit; width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg) }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
button.b { font: 600 0.9rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer }
button.b.primary { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem }
.check input { accent-color: var(--focus); margin: 0 }
.matrix { display: inline-grid; gap: 4px; font-family: var(--mono) }
.matrix input { width: 5.4em; padding: 4px 5px; text-align: right; font-family: var(--mono); font-size: 0.85rem }
.readout { font-family: var(--mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; line-height: 1.45; max-height: 360px; overflow-y: auto }
.readout .hl { background: var(--hl) }
.readout table { border-collapse: collapse }
.readout td, .readout th { padding: 1px 8px; text-align: right; white-space: nowrap }
.readout th { color: var(--muted); font-weight: 600 }
.desc { font-size: 0.92rem; max-width: 75ch }
.desc p { margin: 0 0 8px }
.desc .ref { color: var(--muted); font-size: 0.85rem }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted) }
.legend span::before { content: ""; display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--c) }
footer { font-size: 0.8rem; color: var(--muted) }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
@media (max-width: 880px) { .module { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 560px) { .plotbox.half { grid-column: 1 / -1 } }

</style>
</head>
<body>
<script>
/* Numerics core for the CSc 302/303 interactive modules. Pure functions, no DOM: tested in node by test_num.js.
   Matrices are arrays of row arrays. */
const N = (() => {
  "use strict";
  const N = {};

  /* ---------- expressions: parse, compile, differentiate ---------- */
  const FN = { sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp, log: Math.log, ln: Math.log, sqrt: Math.sqrt,
    abs: Math.abs, atan: Math.atan, asin: Math.asin, acos: Math.acos, sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    log10: Math.log10, sign: Math.sign };
  N.parse = function (src) {
    const toks = [], re = /\s*(\d+\.?\d*(?:[eE][-+]?\d+)?|\.\d+(?:[eE][-+]?\d+)?|[A-Za-z_]\w*|\*\*|[-+*/^(),])/y;
    let m, i = 0; src = String(src).trim();
    while (i < src.length) { re.lastIndex = i; m = re.exec(src); if (!m) throw new Error("cannot read '" + src.slice(i) + "'"); toks.push(m[1]); i = re.lastIndex; }
    let k = 0; const peek = () => toks[k], next = () => toks[k++];
    const expect = t => { if (next() !== t) throw new Error("expected " + t); };
    function expr() { let a = term(); while (peek() === "+" || peek() === "-") { const o = next(); a = { t: "op", o, a, b: term() }; } return a; }
    function term() { let a = unary(); while (peek() === "*" || peek() === "/" || (peek() && /^[\w.(]/.test(peek()) && !isOp(peek()))) { const o = (peek() === "*" || peek() === "/") ? next() : "*"; a = { t: "op", o, a, b: unary() }; } return a; }
    function isOp(t) { return t === ")" || t === "," ; }
    function unary() { if (peek() === "-") { next(); return { t: "neg", a: unary() }; } if (peek() === "+") { next(); return unary(); } return power(); }
    function power() { const a = atom(); if (peek() === "^" || peek() === "**") { next(); return { t: "op", o: "^", a, b: unary() }; } return a; }
    function atom() {
      const t = next(); if (t === undefined) throw new Error("unexpected end");
      if (t === "(") { const e = expr(); expect(")"); return e; }
      if (/^[\d.]/.test(t)) return { t: "num", v: parseFloat(t), s: t };
      if (/^[A-Za-z_]/.test(t)) {
        if (peek() === "(" && FN[t]) { next(); const a = expr(); expect(")"); return { t: "fn", f: t === "ln" ? "log" : t, a }; }
        if (t === "pi") return { t: "num", v: Math.PI, s: PI_STR };
        if (t === "e") return { t: "num", v: Math.E, s: E_STR };
        return { t: "var", n: t };
      }
      throw new Error("unexpected '" + t + "'");
    }
    const e = expr(); if (k < toks.length) throw new Error("unexpected '" + toks[k] + "'"); return e;
  };
  N.compile = function (ast, vars) {
    function c(n) {
      switch (n.t) {
        case "num": { const v = n.v; return () => v; }
        case "var": { const j = vars.indexOf(n.n); if (j < 0) throw new Error("unknown variable " + n.n); return a => a[j]; }
        case "neg": { const f = c(n.a); return a => -f(a); }
        case "fn": { const f = c(n.a), g = FN[n.f]; return a => g(f(a)); }
        case "op": { const f = c(n.a), g = c(n.b);
          if (n.o === "+") return a => f(a) + g(a); if (n.o === "-") return a => f(a) - g(a);
          if (n.o === "*") return a => f(a) * g(a); if (n.o === "/") return a => f(a) / g(a);
          return a => Math.pow(f(a), g(a)); }
      }
    }
    const f = c(ast); return (...a) => f(a);
  };
  const num = v => ({ t: "num", v }), isNum = (n, v) => n.t === "num" && (v === undefined || n.v === v);
  function op(o, a, b) {
    if (isNum(a) && isNum(b)) { const r = N.compile({ t: "op", o, a, b }, [])(); if (Number.isFinite(r)) return num(r); }
    if (o === "+") { if (isNum(a, 0)) return b; if (isNum(b, 0)) return a; }
    if (o === "-") { if (isNum(b, 0)) return a; if (isNum(a, 0)) return neg(b); }
    if (o === "*") { if (isNum(a, 0) || isNum(b, 0)) return num(0); if (isNum(a, 1)) return b; if (isNum(b, 1)) return a; }
    if (o === "/") { if (isNum(a, 0)) return num(0); if (isNum(b, 1)) return a; }
    if (o === "^") { if (isNum(b, 1)) return a; if (isNum(b, 0)) return num(1); }
    return { t: "op", o, a, b };
  }
  function neg(a) { if (isNum(a)) return num(-a.v); if (a.t === "neg") return a.a; return { t: "neg", a }; }
  const fn = (f, a) => ({ t: "fn", f, a });
  N.diff = function d(n, x) {
    switch (n.t) {
      case "num": return num(0);
      case "var": return num(n.n === x ? 1 : 0);
      case "neg": return neg(d(n.a, x));
      case "op": {
        const a = n.a, b = n.b, da = d(a, x), db = d(b, x);
        if (n.o === "+" || n.o === "-") return op(n.o, da, db);
        if (n.o === "*") return op("+", op("*", da, b), op("*", a, db));
        if (n.o === "/") return op("/", op("-", op("*", da, b), op("*", a, db)), op("^", b, num(2)));
        if (isNum(db, 0)) return op("*", op("*", b, op("^", a, op("-", b, num(1)))), da);
        return op("*", n, op("+", op("*", db, fn("log", a)), op("/", op("*", b, da), a)));
      }
      case "fn": {
        const a = n.a, da = d(a, x); let g;
        switch (n.f) {
          case "sin": g = fn("cos", a); break; case "cos": g = neg(fn("sin", a)); break;
          case "tan": g = op("/", num(1), op("^", fn("cos", a), num(2))); break;
          case "exp": g = fn("exp", a); break; case "log": g = op("/", num(1), a); break;
          case "log10": g = op("/", num(1 / Math.LN10), a); break;
          case "sqrt": g = op("/", num(0.5), fn("sqrt", a)); break; case "abs": g = fn("sign", a); break;
          case "atan": g = op("/", num(1), op("+", num(1), op("^", a, num(2)))); break;
          case "asin": g = op("/", num(1), fn("sqrt", op("-", num(1), op("^", a, num(2))))); break;
          case "acos": g = neg(op("/", num(1), fn("sqrt", op("-", num(1), op("^", a, num(2)))))); break;
          case "sinh": g = fn("cosh", a); break; case "cosh": g = fn("sinh", a); break;
          case "tanh": g = op("/", num(1), op("^", fn("cosh", a), num(2))); break;
          case "sign": g = num(0); break;
        }
        return op("*", g, da);
      }
    }
  };
  /** Parse src in variables vars; return {f, df:[partials], d2:[[second partials]], ast}. */
  N.func = function (src, vars) {
    const ast = N.parse(src), f = N.compile(ast, vars);
    const dAst = vars.map(v => N.diff(ast, v));
    const df = dAst.map(a => N.compile(a, vars));
    const d2 = dAst.map(a => vars.map(v => N.compile(N.diff(a, v), vars)));
    return { f, df, d2, ast };
  };

  const PREC = { "+": 1, "-": 1, "*": 2, "/": 2, "^": 3 };
  /** Expression back to text (minimal parentheses). */
  N.str = function str(n, parent = 0, right = false) {
    switch (n.t) {
      case "num": return fmt(n.v, 6);
      case "var": return n.n;
      case "neg": { const s = "−" + str(n.a, 3); return parent >= 2 ? "(" + s + ")" : s; }
      case "fn": return n.f + "(" + str(n.a) + ")";
      case "op": { const p = PREC[n.o], s = str(n.a, p, false) + ` ${n.o === "*" ? "×" : n.o === "-" ? "−" : n.o} ` + str(n.b, p, true); return (p < parent || (p === parent && right && n.o !== "^") || (n.o === "^" && parent === 3 && !right)) ? "(" + s + ")" : s; }
    }
  };
  /** Evaluate an expression rounding every input, operation and function value to the system sys (see fpRound).
      Returns {v, steps: [{s, exact, v, flag}]} where exact is the operation done exactly on the rounded operands. */
  N.fpEval = function (ast, vars, vals, sys) {
    const steps = [], R = x => N.fpRound(x, sys);
    function ev(n) {
      switch (n.t) {
        case "num": { const r = R(n.v); if (r.v !== n.v) steps.push({ s: "store " + fmt(n.v, 10), exact: n.v, v: r.v, flag: r.flag }); return r.v; }
        case "var": { const x = vals[vars.indexOf(n.n)], r = R(x); if (r.v !== x) steps.push({ s: "store " + n.n, exact: x, v: r.v, flag: r.flag }); return r.v; }
        case "neg": return -ev(n.a);
        case "fn": { const a = ev(n.a), ex = N.compile({ t: "fn", f: n.f, a: { t: "num", v: a } }, [])(), r = R(ex); steps.push({ s: `${n.f}(${fmt(a, 8)})`, exact: ex, v: r.v, flag: r.flag }); return r.v; }
        case "op": { const a = ev(n.a), b = ev(n.b), ex = N.compile({ t: "op", o: n.o, a: { t: "num", v: a }, b: { t: "num", v: b } }, [])(), r = R(ex);
          steps.push({ s: `${fmt(a, 8)} ${n.o === "*" ? "×" : n.o === "-" ? "−" : n.o} ${fmt(b, 8)}`, exact: ex, v: r.v, flag: r.flag }); return r.v; }
      }
    }
    const v = ev(ast); return { v, steps };
  };

  /* ---------- high-precision reference values ---------- */
  const PI_STR = "3.14159265358979323846264338327950288419716939937510582097494459230781640628620899863";
  const E_STR = "2.71828182845904523536028747135266249775724709369995957496696762772407663035354759457";
  const DIG = 60n, S = 10n ** DIG;                    // fixed-point scale for function evaluation
  const babs = a => a < 0n ? -a : a;
  function gcd(a, b) { a = babs(a); b = babs(b); while (b) [a, b] = [b, a % b]; return a; }
  const rat = (n, d = 1n) => { if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; };
  function ratFromStr(t) { const m = t.match(/^(\d*)(?:\.(\d*))?(?:[eE]([-+]?\d+))?$/); let n = BigInt((m[1] || "0") + (m[2] || "")), d = 10n ** BigInt((m[2] || "").length); const e = parseInt(m[3] || "0", 10); if (e > 0) n *= 10n ** BigInt(e); else if (e < 0) d *= 10n ** BigInt(-e); return rat(n, d); }
  function ratFromDouble(x) { if (x === 0) return rat(0n); let e = 0; while (!Number.isInteger(x) && e < 1100) { x *= 2; e++; } return rat(BigInt(x), 2n ** BigInt(e)); }
  function ratToDouble(r) {
    if (r.n === 0n) return 0; const neg = r.n < 0n, n = babs(r.n);
    const sh = BigInt(n.toString(2).length - r.d.toString(2).length - 60);   // scale so the quotient has ~60 bits
    const q = sh >= 0n ? n / (r.d << sh) : (n << -sh) / r.d;
    const v = Number(q) * Math.pow(2, Number(sh)); return neg ? -v : v;
  }
  const toFix = r => r.n * S / r.d, fromFix = v => rat(v, S);
  const fmul = (a, b) => a * b / S, fdiv = (a, b) => a * S / b;
  function isqrt(n) { if (n < 2n) return n; let x = BigInt(Math.floor(Math.sqrt(Number(n)))) || 1n; for (;;) { const y = (x + n / x) >> 1n; if (babs(y - x) <= 1n) { while (y * y > n) return y - 1n; return y; } x = y; } }
  function fexp(x) { let m = 0n; while (babs(x) > S / 2n) { x /= 2n; m++; } let t = S, s = S; for (let k = 1n; k < 80n; k++) { t = fmul(t, x) / k; if (t === 0n) break; s += t; } for (; m > 0n; m--) s = fmul(s, s); return s; }
  function fatanh(z) { let s = 0n, p = z; const z2 = fmul(z, z); for (let k = 1n; k < 400n; k += 2n) { const t = p / k; if (t === 0n) break; s += t; p = fmul(p, z2); } return s; }
  const LN2 = 2n * fatanh(S / 3n);
  function flog(x) { if (x <= 0n) throw new Error("log of a non-positive number"); let m = 0n; while (x > 2n * S) { x /= 2n; m++; } while (x < S / 2n) { x *= 2n; m--; } return 2n * fatanh(fdiv(x - S, x + S)) + m * LN2; }
  const FPI = ratFromStr(PI_STR.slice(0, 70)), PIF = toFix(FPI);
  function fsincos(x) { const tp = 2n * PIF; x = x % tp; if (x > PIF) x -= tp; if (x < -PIF) x += tp; let s = 0n, c = 0n, t = S; for (let k = 0n; k < 120n; k++) { if (t === 0n) break; if (k % 2n === 0n) c += (k % 4n === 0n ? t : -t); else s += (k % 4n === 1n ? t : -t); t = fmul(t, x) / (k + 1n); } return [s, c]; }
  /** Value of an expression without rounding error (exact rationals for + − × ÷ and integer powers, 60-digit
      fixed point for sqrt, exp, log, sin, cos, tan); other functions fall back to double precision. */
  N.exactEval = function (ast) {
    function ev(n) {
      switch (n.t) {
        case "num": return n.s ? ratFromStr(n.s) : ratFromDouble(n.v);
        case "var": throw new Error("variables not allowed");
        case "neg": { const a = ev(n.a); return { n: -a.n, d: a.d }; }
        case "op": {
          const a = ev(n.a), b = ev(n.b);
          if (n.o === "+") return rat(a.n * b.d + b.n * a.d, a.d * b.d); if (n.o === "-") return rat(a.n * b.d - b.n * a.d, a.d * b.d);
          if (n.o === "*") return rat(a.n * b.n, a.d * b.d); if (n.o === "/") { if (b.n === 0n) throw new Error("division by zero"); return rat(a.n * b.d, a.d * b.n); }
          if (b.d === 1n && babs(b.n) <= 4000n) { const k = b.n, p = rat(a.n ** babs(k), a.d ** babs(k)); return k < 0n ? rat(p.d, p.n) : p; }
          if (b.d === 2n && b.n === 1n) return ev({ t: "fn", f: "sqrt", a: n.a });
          return fromFix(fexp(fmul(toFix(b), flog(toFix(a)))));
        }
        case "fn": {
          const a = ev(n.a), x = toFix(a);
          switch (n.f) {
            case "sqrt": if (a.n < 0n) throw new Error("sqrt of a negative number"); return rat(isqrt(a.n * S * S / a.d), S);
            case "exp": return fromFix(fexp(x));
            case "log": return fromFix(flog(x));
            case "sin": return fromFix(fsincos(x)[0]);
            case "cos": return fromFix(fsincos(x)[1]);
            case "tan": { const [s, c] = fsincos(x); return fromFix(fdiv(s, c)); }
            case "abs": return { n: babs(a.n), d: a.d };
            default: return ratFromDouble(FN[n.f](ratToDouble(a)));
          }
        }
      }
    }
    return ratToDouble(ev(ast));
  };

  /* ---------- exact simulated arithmetic (rationals rounded to p digits in base beta) ---------- */
  const Q = {};
  Q.of = x => {

const PAGE = {"title": "Interpolation", "sub": "Heath Chapter 7 \u00b7 CSc 302 meetings 24\u201325 \u00b7 interactive modules", "footer": "<div class=\"fl\"><b>Textbooks:</b> M. T. Heath, <i>Scientific Computing: An Introductory Survey</i>, revised 2nd ed., SIAM, 2018 \u00b7 J. Stewart, D. Clegg and S. Watson, <i>Calculus: Early Transcendentals</i>, 9th ed., Cengage, 2021.</div><div class=\"fl\"><b>Disclaimer:</b> Original code written for CSc 302/303 (CCNY); numerics checked against NumPy and SciPy.</div>", "links": "<span class=\"nav\"><a href=\"index.html\">Interactive modules</a> \u00b7 <a href=\"csc302_info.html\">CSc 302 Info</a> \u00b7 <a href=\"csc303_info.html\">CSc 303 Info</a> \u00b7 <a href=\"multivariable_calculus.html\">Calc pages</a> \u00b7 <a href=\"unit_summaries.html\">Unit summaries</a></span>"};
/* Chapter 7 modules not covered by the Interpolation Playground: basis functions, Chebyshev polynomials,
   Bernstein polynomials, Taylor polynomials, Newton interpolation (incremental), error bounds, B-splines. Heath §7.1-7.4. */
(() => {
  const fmt = N.fmt, el = UI.el;
  const COLS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7"];
  const steppers = (ctx, get, set, max) => UI.buttons([["◀ Back", () => { set(Math.max(0, get() - 1)); ctx.redraw(); }], ["Next ▶", () => { set(Math.min(max(), get() + 1)); ctx.redraw(); }, true], ["All", () => { set(max()); ctx.redraw(); }], ["Restart", () => { set(0); ctx.redraw(); }]]);

  /* ---------- basis functions: one polynomial in four bases ---------- */
  const sumBasis = {
    id: "basis-functions", title: "Basis functions",
    ref: "Heath §7.3.1–7.3.4 · Examples 7.1–7.3",
    desc: `<p>A polynomial p of degree n can be written in any basis of the polynomials of degree ≤ n. Press Next to add one more basis function (times its coefficient) to the partial sum.
      In the <b>monomial</b> basis the partial sums are Taylor polynomials at 0; in the <b>Lagrange</b> basis (equally spaced nodes on [−1, 1]) each term matches p at one node and is 0 at the others;
      in the <b>Newton</b> basis the k-th partial sum interpolates p at the first k+1 nodes; in the <b>Chebyshev</b> basis the partial sums are nearly the best approximations of their degree, so they get close fastest.</p>`,
    tries: ["Same polynomial, all four bases: which partial sum is closest after 3 terms?", "Lagrange: after each Next, check which node now matches.", "Random polynomial of degree 8: compare the sizes of the monomial and Chebyshev coefficients."],
    init(ctx) {
      const plot = ctx.plot("p (black) and the partial sum", { aspect: "16 / 9" }), bas = ctx.plot("Basis functions (current one bold)", { aspect: "16 / 6" });
      const basis = UI.select({ label: "Basis", options: [["mono", "monomial 1, x, x², …"], ["lag", "Lagrange (equally spaced nodes)"], ["newt", "Newton (same nodes)"], ["cheb", "Chebyshev T₀, T₁, …"]] }, () => { at = 0; ctx.redraw(); });
      const coef = UI.input({ label: "p(x) coefficients c₀, c₁, … (monomial)", value: "0.2, -1, 0.5, 2, -0.8, -1.2" }, () => { at = 0; ctx.redraw(); });
      let at = 0;
      ctx.add(basis, coef, UI.buttons([["Random degree 8", () => { const r = N.rng(Math.floor(Math.random() * 1e6)); coef.value = [...Array(9)].map(() => fmt(2 * r() - 1, 2)).join(", "); at = 0; ctx.redraw(); }]]), steppers(ctx, () => at, v => at = v, () => cs().length - 1));
      const out = ctx.readout("Coefficients in the chosen basis");
      const cs = () => coef.value.split(/[,\s]+/).filter(Boolean).map(Number).filter(Number.isFinite);
      return () => {
        const c = cs(); if (!c.length) return; const n = c.length - 1, p = x => N.polyval(c, x), nodes = [...Array(n + 1).keys()].map(i => n ? -1 + 2 * i / n : 0);
        let phi, a;   // basis function k and coefficient in that basis
        if (basis.value === "mono") { phi = (k, x) => x ** k; a = c.slice(); }
        else if (basis.value === "lag") { phi = (k, x) => N.lagrangeBasis(nodes, k, x); a = nodes.map(p); }
        else if (basis.value === "newt") { phi = (k, x) => nodes.slice(0, k).reduce((s, t) => s * (x - t), 1); a = N.divdiff(nodes, nodes.map(p)).c; }
        else { phi = (k, x) => N.chebT(k, x); const V = nodes.map((_, i) => { const t = Math.cos(Math.PI * (i + 0.5) / (n + 1)); return [...Array(n + 1).keys()].map(k => N.chebT(k, t)); }); a = N.solve(V, nodes.map((_, i) => p(Math.cos(Math.PI * (i + 0.5) / (n + 1))))); }
        const part = x => { let s = 0; for (let k = 0; k <= at; k++) s += a[k] * phi(k, x); return s; };
        const ys = []; for (let i = 0; i <= 200; i++) ys.push(p(-1 + i / 100)); const yr = UI.range(ys, 0.3);
        plot.view(-1.05, 1.05, yr[0], yr[1]).begin("x");
        plot.fn(p, -1.05, 1.05, { color: "--exact", width: 2.4 }).fn(part, -1.05, 1.05, { color: "--c1", width: 2.2 });
        if (at > 0) { const prev = x => part(x) - a[at] * phi(at, x); plot.fn(prev, -1.05, 1.05, { color: "--c1", width: 1, dash: [4, 4], alpha: 0.6 }); }
        if (basis.value === "lag" || basis.value === "newt") plot.pts(nodes, nodes.map(p), { color: "--exact", r: 3.5, hollow: true }).pts(nodes.slice(0, basis.value === "newt" ? at + 1 : nodes.length).filter((_, i) => basis.value === "newt" || i <= at), nodes.filter((_, i) => basis.value === "newt" ? i <= at : i <= at).map(p), { color: "--c1", r: 4 });
        plot.note(`${at + 1} of ${n + 1} terms`, { bold: true }).end();
        let bmax = 1; for (let k = 0; k <= n; k++) for (let i = 0; i <= 50; i++) bmax = Math.max(bmax, Math.abs(phi(k, -1 + i / 25)));
        bas.view(-1.05, 1.05, -bmax * 1.1, bmax * 1.1).begin("x");
        for (let k = 0; k <= n; k++) bas.fn(x => phi(k, x), -1.05, 1.05, { color: COLS[k % 7], width: k === at ? 3 : 1, alpha: k === at ? 1 : 0.45 });
        bas.end();
        const err = (() => { let m = 0; for (let i = 0; i <= 200; i++) { const x = -1 + i / 100; m = Math.max(m, Math.abs(p(x) - part(x))); } return m; })();
        out.innerHTML = UI.table(["k", "coefficient"], a.map((v, k) => [k, fmt(v, 6)]), at) + `\nmax |p − partial sum| on [−1, 1] = ${fmt(err, 3)}`;
      };
    },
  };

  /* ---------- Chebyshev polynomials ---------- */
  const cheb = {
    id: "chebyshev", title: "Chebyshev polynomials",
    ref: "Heath §7.3.4 (orthogonal polynomials), §7.3.5 (Chebyshev points)",
    desc: `<p>T<sub>k</sub>(x) = cos(k arccos x): on [−1, 1] it oscillates between −1 and 1, reaching ±1 at k+1 points and crossing zero at k points.
      Equivalently, T<sub>k</sub>(cos θ) = cos kθ, so the zeros are the projections onto the x-axis of k equally spaced points on the upper half circle (lower plot) —
      they cluster near ±1, which is exactly what is needed to tame Runge's phenomenon. The three-term recurrence T<sub>k+1</sub> = 2xT<sub>k</sub> − T<sub>k−1</sub> generates them.</p>`,
    tries: ["k = 1, 2, 3 by hand from the recurrence, then compare.", "Watch the zeros crowd toward the ends as k grows.", "Among monic polynomials of degree k, 2^(1−k)T_k has the smallest maximum on [−1, 1]: compare its maximum with that of the monic polynomial with equally spaced roots."],
    init(ctx) {
      const plot = ctx.plot("Tₖ(x), zeros (red) and extrema", { aspect: "16 / 8" }), circ = ctx.plot("Zeros as projections of equally spaced points on the half circle", { aspect: "16 / 7", equal: true });
      const k = UI.slider({ label: "Degree k", min: 0, max: 20, step: 1, value: 5, fmt: v => v }, () => ctx.redraw());
      const all = UI.check({ label: "show T₀ … Tₖ₋₁ too", value: false }, () => ctx.redraw());
      ctx.add(k, all); const out = ctx.readout("Values");
      return () => {
        const K = k.value; plot.view(-1.08, 1.08, -1.25, 1.25).begin("x", "Tₖ(x)");
        if (all.value) for (let j = 0; j < K; j++) plot.fn(x => N.chebT(j, x), -1, 1, { color: COLS[j % 7], width: 1, alpha: 0.4 });
        plot.fn(x => N.chebT(K, x), -1, 1, { color: "--c1", width: 2.6, n: 800 });
        const zeros = [...Array(K).keys()].map(i => Math.cos((2 * i + 1) * Math.PI / (2 * K))), ext = [...Array(K + 1).keys()].map(i => Math.cos(i * Math.PI / Math.max(K, 1)));
        plot.pts(zeros, zeros.map(() => 0), { color: "--err", r: 4 }); if (K) plot.pts(ext, ext.map(x => N.chebT(K, x)), { color: "--c3", r: 3.5, hollow: true });
        plot.end();
        circ.view(-1.15, 1.15, -0.15, 1.1).begin();
        circ.fn(x => Math.sqrt(Math.max(0, 1 - x * x)), -1, 1, { color: "--muted", width: 1.2 });
        zeros.forEach((z, i) => { const th = (2 * i + 1) * Math.PI / (2 * K), y = Math.sin(th); circ.seg(0, 0, z, y, { color: "--grid", width: 1 }).seg(z, y, z, 0, { color: "--err", width: 1, dash: [3, 3] }).pts([z], [y], { color: "--c1", r: 3.5 }); });
        circ.pts(zeros, zeros.map(() => 0), { color: "--err", r: 4 }).hline(0, { color: "--muted", width: 1 }).end();
        const eq = [...Array(K).keys()].map(i => K > 1 ? -1 + 2 * i / (K - 1) : 0); let me = 0, mc = 0; for (let i = 0; i <= 400; i++) { const x = -1 + i / 200; me = Math.max(me, Math.abs(eq.reduce((s, t) => s * (x - t), 1))); mc = Math.max(mc, Math.abs(zeros.reduce((s, t) => s * (x - t), 1))); }
        out.textContent = `zeros: ${zeros.map(z => fmt(z, 4)).join(", ")}\nmax |Π(x − xᵢ)| on [−1, 1]:\n  Chebyshev zeros     ${fmt(mc, 4)}  (= 2^(1−k) = ${fmt(K ? 2 ** (1 - K) : 1, 4)})\n  equally spaced roots ${fmt(me, 4)}`;
      };
    },
  };

  /* ---------- Bernstein polynomials ---------- */
  const FUNCS = [["sin(3*x) + x", "sin 3x + x"], ["abs(x - 0.4)", "|x − 0.4|"], ["exp(-20*(x-0.5)^2)", "Gaussian bump"], ["x^2", "x²"], ["1/(1 + 25*(2*x-1)^2)", "Runge function on [0, 1]"]];
  const bern = {
    id: "bernstein", title: "Bernstein polynomials",
    ref: "Heath §7.3.5 (Weierstrass approximation theorem) · §7.4.3 (related: B-splines, Bézier curves)",
    desc: `<p>The Bernstein basis polynomials b<sub>k,n</sub>(t) = C(n, k) t<sup>k</sup>(1 − t)<sup>n−k</sup> on [0, 1] are nonnegative and sum to 1. The Bernstein polynomial of f,
      B<sub>n</sub>f(t) = Σ f(k/n) b<sub>k,n</sub>(t), is a weighted average of samples of f: it converges to any continuous f (a constructive proof of the Weierstrass theorem),
      never overshoots, but converges slowly — the error decreases only like 1/n for smooth f. The same basis defines Bézier curves.</p>`,
    tries: ["Watch the error plot: slope −1 on the log–log scale, even for x².", "|x − 0.4| has a corner: Bₙf still converges, without oscillation.", "Compare with polynomial interpolation of the Runge function: Bernstein never blows up."],
    init(ctx) {
      const plot = ctx.plot("f (black), Bₙf (blue), samples f(k/n)", { aspect: "16 / 8" }), bas = ctx.plot("Basis b₍k,n₎(t)", { aspect: "16 / 5" }), conv = ctx.plot("max |f − Bₙf| versus n", { aspect: "16 / 5", logx: true, logy: true });
      const fsel = UI.select({ label: "f(t)", options: FUNCS }, () => ctx.redraw());
      const n = UI.slider({ label: "Degree n", min: 1, max: 80, step: 1, value: 8, fmt: v => v }, () => ctx.redraw());

        const ys = []; for (let i = 0; i <= 200; i++) ys.push(f(i / 200)); const yr = UI.range(ys, 0.2);

        plot.fn(f, 0, 1, { color: "--exact", width: 2.2 }).fn(t => B(nv, t), 0, 1, { color: "--c1", width: 2.2 });
        if (nv <= 40) plot.pts([...Array(nv + 1).keys()].map(k => k / nv), [...Array(nv + 1).keys()].map(k => f(k / nv)), { color: "--c2", r: 3 });
        plot.end();
        bas.view(-0.02, 1.02, 0, 1.05).begin("t"); for (let k = 0; k <= Math.min(nv, 30); k++) bas.fn(t => N.bernstein(nv, k, t), 0, 1, { color: COLS[k % 7], width: 1.2 }); bas.end();
        const ns = [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64, 80], errs = ns.map(m => { let e = 0; for (let i = 0; i <= 200; i++) e = Math.max(e, Math.abs(f(i / 200) - B(m, i / 200))); return Math.max(e, 1e-16); });
        conv.view(1, 100, Math.min(...errs) / 3, Math.max(...errs) * 3).begin("n", "max error");
        conv.fn(m => errs[0] / m, 1, 100, { color: "--muted", dash: [5, 4], width: 1 }).line(ns, errs, { color: "--c1", width: 1.6 }).pts(ns, errs, { color: "--c1", r: 3 }).note("dashed: slope −1", { right: true }).end();
        let e = 0; for (let i = 0; i <= 400; i++) e = Math.max(e, Math.abs(f(i / 400) - B(nv, i / 400)));
        out.textContent = `max |f − Bₙf| = ${fmt(e, 4)} for n = ${nv}`;
      };
    },
  };

  /* ---------- Taylor polynomials ---------- */
  const taylor = {
    id: "taylor", title: "Taylor interpolation",
    ref: "Heath §7.2 and §7.3.5 (interpolating derivatives at one point) · Taylor's theorem, §1.2",
    desc: `<p>The Taylor polynomial of degree n at x₀ matches f and its first n derivatives at the single point x₀ — interpolation with all conditions concentrated at one node.
      It is excellent near x₀ and poor far away; its error is f<sup>(n+1)</sup>(ξ)(x − x₀)<sup>n+1</sup>/(n+1)!. For 1/(1 + x²) the Taylor series at 0 converges only for |x| &lt; 1,
      because of the complex poles at ±i — no matter how large n is.</p>`,
    tries: ["eˣ at x₀ = 0: the error plot is a V that widens as n grows.", "1/(1 + x²) at x₀ = 0: beyond |x| = 1 more terms make it worse. Move x₀ to 1 and compare the radius (√2).", "ln(1 + x) at x₀ = 0: the radius of convergence is 1."],
    init(ctx) {
      const plot = ctx.plot("f (black) and Taylor polynomials", { aspect: "16 / 9" }), ep = ctx.plot("|f − pₙ| (log scale)", { aspect: "16 / 6", logy: true });
      const fx = UI.select({ label: "f(x)", options: [["exp(x)", "eˣ"], ["sin(x)", "sin x"], ["1/(1 + x^2)", "1/(1 + x²)"], ["log(1 + x)", "ln(1 + x)"], ["sqrt(1 + x)", "√(1 + x)"], ["atan(x)", "arctan x"]] }, () => ctx.redraw());
      const x0 = UI.slider({ label: "Center x₀", min: -2, max: 2, step: 0.05, value: 0, fmt: v => fmt(v, 3) }, () => ctx.redraw());
      const n = UI.slider({ label: "Degree n", min: 0, max: 30, step: 1, value: 4, fmt: v => v }, () => ctx.redraw());
      const lo = UI.input({ label: "plot from", value: "-3" }, () => ctx.redraw()), hi = UI.input({ label: "to", value: "3" }, () => ctx.redraw());
      ctx.add(fx, x0, n, el("div", { class: "btns" }, lo.el, hi.el)); const out = ctx.readout("Coefficients");
      return () => {
        const ast = N.parse(fx.value), f = N.compile(ast, ["x"]), a = +lo.value, b = +hi.value, c0 = x0.value;
        let c; try { c = N.taylor(ast, "x", c0, n.value); } catch (e) { out.textContent = e.message; return; }
        const p = x => N.polyval(c, x - c0), ys = []; for (let i = 0; i <= 300; i++) { const v = f(a + (b - a) * i / 300); if (Number.isFinite(v)) ys.push(v); }
        const yr = UI.range(ys, 0.3); plot.view(a, b, yr[0], yr[1]).begin("x");
        for (let m = 0; m < n.value; m++) { const cm = c.slice(0, m + 1); plot.fn(x => N.polyval(cm, x - c0), a, b, { color: COLS[m % 7], width: 1, alpha: 0.25 }); }
        plot.fn(f, a, b, { color: "--exact", width: 2.4 }).fn(p, a, b, { color: "--c1", width: 2.4 }).vline(c0, { color: "--muted", dash: [3, 3], width: 1 }).pts([c0], [f(c0)], { color: "--err", r: 4.5 }).end();
        ep.view(a, b, 1e-17, 1e3).begin("x"); ep.fn(x => Math.max(Math.abs(f(x) - p(x)), 1e-17), a, b, { color: "--err", width: 1.6, n: 600 }).vline(c0, { color: "--muted", dash: [3, 3], width: 1 }).end();
        out.innerHTML = UI.table(["k", "f⁽ᵏ⁾(x₀)/k!"], c.map((v, k) => [k, fmt(v, 8)]).slice(0, 16));
      };
    },
  };

  /* ---------- Newton interpolation, adding one point at a time ---------- */
  const newtonInterp = {
    id: "newton-interpolation", title: "Newton interpolation",
    ref: "Heath §7.3.3 · Examples 7.3–7.5",
    desc: `<p>In the Newton form p(t) = c₀ + c₁(t − t₁) + c₂(t − t₁)(t − t₂) + …, adding a data point adds one term and leaves the earlier coefficients unchanged:
      the new coefficient is the next divided difference. Click to add points (drag to move, shift-click to delete). The dashed curve is the previous interpolant, the thin colored curve the new term,
      and the table shows the divided differences with the coefficients on its top edge.</p>`,
    tries: ["Add points one at a time and confirm that the old coefficients never change.", "Move the last point: only the last coefficient changes.", "Put four points on a parabola: the third divided difference is 0, so the cubic term vanishes."],
    init(ctx) {
      const plot = ctx.plot("Interpolants p₀, p₁, … (click to add points)", { aspect: "16 / 9" });
      ctx.add(UI.buttons([["Clear", () => { pts = []; ctx.redraw(); }], ["Example: (1,1), (2,8), (3,27), (4,64)", () => { pts = [[1, 1], [2, 8], [3, 27], [4, 64]].map(([x, y]) => [x, y / 10]); ctx.redraw(); }]]));
      const out = ctx.readout("Divided differences");
      let pts = [[0.5, 1], [2, 2.5], [3.5, 1.5]], drag = -1;
      plot.onPointer((type, x, y, e) => {
        if (type === "down") { const i = pts.findIndex(p => plot.pxDist(p[0], p[1], x, y) < 10); if (i >= 0 && e.shiftKey) { pts.splice(i, 1); drag = -1; } else if (i >= 0) drag = i; else if (!pts.some(p => Math.abs(p[0] - x) < 1e-3)) { pts.push([x, y]); drag = pts.length - 1; } ctx.redraw(); }
        else if (type === "drag" && drag >= 0) { if (!pts.some((p, i) => i !== drag && Math.abs(p[0] - x) < 1e-3)) pts[drag] = [x, y]; ctx.redraw(); } else if (type === "up") drag = -1;
      });
      return () => {
        plot.view(0, 5, -1, 4).begin("t", "y");
        const n = pts.length;
        if (n) {
          const t = pts.map(p => p[0]), { c, table } = N.divdiff(t, pts.map(p => p[1]));
          for (let k = 0; k < n; k++) { const ck = c.slice(0, k + 1); plot.fn(x => N.newtonEval(t, ck, x), 0, 5, { color: COLS[k % 7], width: k === n - 1 ? 2.6 : 1, alpha: k === n - 1 ? 1 : 0.35, dash: k === n - 2 ? [5, 4] : [] }); }
          if (n > 1) plot.fn(x => c[n - 1] * t.slice(0, n - 1).reduce((s, ti) => s * (x - ti), 1), 0, 5, { color: COLS[(n - 1) % 7], width: 1.2, dash: [2, 3] });
          plot.pts(t, pts.map(p => p[1]), { color: "--exact", r: 5 });
          pts.forEach((p, i) => plot.text(p[0], p[1], String(i + 1), { dx: 7, dy: -9, size: 11, bold: true }));
          const rows = t.map((ti, i) => [fmt(ti, 4)].concat(table.map(col => col[i] !== undefined ? fmt(col[i], 5) : "")));
          out.innerHTML = UI.table(["tᵢ", "y", ...[...Array(n - 1).keys()].map(j => `order ${j + 1}`)], rows, 0) + `\ncoefficients c = [${c.map(v => fmt(v, 5)).join(", ")}]\np(t) = ${c.map((v, k) => fmt(v, 4) + t.slice(0, k).map(ti => `(t − ${fmt(ti, 3)})`).join("")).join(" + ")}`;
        } else out.textContent = "Click in the plot to add data points.";
        plot.end();
      };
    },
  };

  /* ---------- interpolation error bound ---------- */
  const errBound = {
    id: "error-bounds", title: "Error bounds",
    ref: "Heath §7.3.5 · interpolation error f(t) − p(t) = f⁽ⁿ⁺¹⁾(ξ)/(n+1)! · Π(t − tᵢ)",
    desc: `<p>For the polynomial p of degree n interpolating f at n + 1 nodes, f(t) − p(t) = f<sup>(n+1)</sup>(ξ)/(n+1)! · w(t) with the nodal polynomial w(t) = Π(t − tᵢ).
      Hence |f − p| ≤ M/(n+1)! · |w(t)|, where M = max |f<sup>(n+1)</sup>|. The bound has two factors you can see: M depends on f, and |w| depends only on the nodes —
      large near the ends for equally spaced nodes and evenly small for Chebyshev nodes.</p>`,
    tries: ["sin x with 6 nodes: the bound is tight.", "Runge's function with equally spaced nodes: M grows like n!, so the bound (and the error) explode near the ends.", "Switch to Chebyshev nodes and compare max |w|."],
    init(ctx) {
      const plot = ctx.plot("|f − p| (red) and the bound M/(n+1)!·|w(t)| (dashed)", { aspect: "16 / 8", logy: true }), wp = ctx.plot("Nodal polynomial w(t) = Π(t − tᵢ)", { aspect: "16 / 6" });
      const fx = UI.select({ label: "f(t) on [−1, 1]", options: [["sin(3*x)", "sin 3t"], ["exp(x)", "eᵗ"], ["1/(1 + 25*x^2)", "Runge 1/(1 + 25t²)"], ["1/(2 + x)", "1/(2 + t)"]] }, () => ctx.redraw());
      const n = UI.slider({ label: "Polynomial degree n (n + 1 nodes)", min: 1, max: 20, step: 1, value: 6, fmt: v => v }, () => ctx.redraw());
      const nodes = UI.select({ label: "Nodes", options: [["eq", "equally spaced"], ["ch", "Chebyshev"]] }, () => ctx.redraw());
      ctx.add(fx, n, nodes); const out = ctx.readout("Bound");
      return () => {
        const ast = N.parse(fx.value), f = N.compile(ast, ["x"]), nv = n.value;
        const t = nodes.value === "eq" ? [...Array(nv + 1).keys()].map(i => -1 + 2 * i / nv) : N.chebNodes(nv + 1);
        const { c } = N.divdiff(t, t.map(f)), p = x => N.newtonEval(t, c, x), w = x => t.reduce((s, ti) => s * (x - ti), 1);
        let fact = 1; for (let i = 2; i <= nv + 1; i++) fact *= i;
        let M = 0; for (let i = 0; i <= 200; i++) { const x = -1 + i / 100; const cs = N.taylor(ast, "x", x, nv + 1); M = Math.max(M, Math.abs(cs[nv + 1]) * fact); }
        const bound = x => M / fact * Math.abs(w(x));
        let emax = 0, bmax = 0, wmax = 0; for (let i = 0; i <= 400; i++) { const x = -1 + i / 200; emax = Math.max(emax, Math.abs(f(x) - p(x))); bmax = Math.max(bmax, bound(x)); wmax = Math.max(wmax, Math.abs(w(x))); }
        plot.view(-1, 1, Math.max(1e-17, emax * 1e-6), Math.max(bmax, emax) * 10).begin("t");
        plot.fn(x => Math.max(Math.abs(f(x) - p(x)), 1e-17), -1, 1, { color: "--err", width: 1.8, n: 800 }).fn(x => Math.max(bound(x), 1e-17), -1, 1, { color: "--c1", width: 1.6, dash: [6, 4], n: 800 });
        t.forEach(ti => plot.vline(ti, { color: "--grid", width: 1 })); plot.end();
        wp.view(-1, 1, -wmax * 1.15, wmax * 1.15).begin("t"); wp.fn(w, -1, 1, { color: "--c3", width: 2, n: 600 }).pts(t, t.map(() => 0), { color: "--exact", r: 3.5 }).end();
        out.textContent = `M = max |f⁽ⁿ⁺¹⁾| on [−1, 1] ≈ ${fmt(M, 4)}\n(n+1)! = ${fmt(fact, 4)}\nmax |w| = ${fmt(wmax, 4)}\nbound M/(n+1)!·max|w| = ${fmt(bmax, 4)}\nactual max |f − p|     = ${fmt(emax, 4)}`;
      };
    },
  };

  /* ---------- B-splines ---------- */
  const bspline = {
    id: "b-splines", title: "B-splines",
    ref: "Heath §7.4.3",
    desc: `<p>B-splines B<sub>i,k</sub> of degree k are built recursively from piecewise constants (Cox–de Boor). Each is nonnegative, nonzero on only k + 1 knot intervals (local support),
      and together they sum to 1. Any spline of degree k on these knots is Σ cᵢB<sub>i,k</sub>: drag the control values cᵢ (squares) and see that moving one changes the curve only locally.
      Repeating end knots makes the curve start and end at the first and last control values.</p>`,
    tries: ["Degree 0, 1, 2, 3: count the intervals on which each basis function is nonzero.", "Drag one control value: only k + 1 intervals of the curve move.", "Check the 'sum' curve: it is identically 1 between the end knots."],
    init(ctx) {
      const basis = ctx.plot("Basis functions Bᵢ,ₖ and their sum", { aspect: "16 / 6" }), curve = ctx.plot("Spline Σ cᵢ Bᵢ,ₖ (drag the squares)", { aspect: "16 / 8" });
      const k = UI.slider({ label: "Degree k", min: 0, max: 3, step: 1, value: 3, fmt: v => v }, () => { reset(); ctx.redraw(); });
      const m = UI.slider({ label: "Number of knot intervals", min: 2, max: 10, step: 1, value: 6, fmt: v => v }, () => { reset(); ctx.redraw(); });
      const clamp = UI.check({ label: "repeat the end knots (clamped)", value: true }, () => { reset(); ctx.redraw(); });
      ctx.add(k, m, clamp); const out = ctx.readout("Knots");
      let knots, cs, drag = -1;
      function reset() { const K = k.value, M = m.value, inner = [...Array(M + 1).keys()]; knots = clamp.value ? [...Array(K).fill(0), ...inner, ...Array(K).fill(M)] : [...Array(2 * K + M + 1).keys()].map(i => i - K); const nb = knots.length - K - 1; cs = [...Array(nb).keys()].map(i => 1 + Math.sin(i * 1.3) * 0.8); }
      reset();
      const xc = i => { const K = k.value; let s = 0; for (let j = 1; j <= K; j++) s += knots[i + j]; return K ? s / K : (knots[i] + knots[i + 1]) / 2; };  // Greville abscissae
      curve.onPointer((type, x, y) => { if (type === "down") drag = cs.findIndex((c, i) => curve.pxDist(xc(i), c, x, y) < 12); if (type === "drag" && drag >= 0) { cs[drag] = y; ctx.redraw(); } if (type === "up") drag = -1; });
      return () => {
        const K = k.value, M = m.value, a = clamp.value ? 0 : 0, b = M, nb = cs.length;
        basis.view(knots[0] - 0.2, knots[knots.length - 1] + 0.2, -0.05, 1.12).begin("t");
        for (let i = 0; i < nb; i++) basis.fn(t => N.bspl(knots, i, K, t), knots[0], knots[knots.length - 1], { color: COLS[i % 7], width: 1.8, n: 600 });
        basis.fn(t => { let s = 0; for (let i = 0; i < nb; i++) s += N.bspl(knots, i, K, t); return s; }, a, b, { color: "--exact", width: 1.4, dash: [5, 4], n: 600 });
        [...new Set(knots)].forEach(t => basis.vline(t, { color: "--grid", width: 1 })); basis.end();
        curve.view(knots[0] - 0.2, knots[knots.length - 1] + 0.2, -0.5, 3).begin("t");
        curve.fn(t => { let s = 0; for (let i = 0; i < nb; i++) s += cs[i] * N.bspl(knots, i, K, t); return s; }, a, b, { color: "--c1", width: 2.6, n: 600 });
        curve.line(cs.map((_, i) => xc(i)), cs, { color: "--muted", width: 1, dash: [4, 4] });
        cs.forEach((c, i) => { const X = curve.X(xc(i)), Y = curve.Y(c), g = curve.g; g.fillStyle = UI.css(COLS[i % 7]); g.fillRect(X - 5, Y - 5, 10, 10); });
        curve.end();
        out.textContent = `knots: ${knots.join(", ")}\n${nb} basis functions of degree ${K}\neach is nonzero on ${K + 1} knot intervals`;
      };
    },
  };

  const playgroundLink = {
    id: "playground", title: "Polynomial bases, convergence, piecewise cubic, polynomial vs spline",
    ref: "Heath §7.3–7.4",
    desc: `<p>Polynomial bases, convergence (Runge's phenomenon), piecewise cubic interpolation and polynomial vs spline interpolation are covered by the course's
      <b>Interpolation Playground</b>: drag data points and compare polynomial, piecewise linear, cubic spline (natural / not-a-knot) and monotone cubic (PCHIP) interpolants, or sample a function at equally spaced or Chebyshev nodes.</p>
      <p><a href="interpolation_playground.html">Open the Interpolation Playground</a></p>`,
    init(ctx) { ctx.plots.remove(); ctx.add(el("p", { class: "sub" }, "This tab only links to the existing tool.")); return () => {}; },
  };

  UI.page(Object.assign({}, PAGE, { modules: [sumBasis, newtonInterp, cheb, taylor, errBound, bern, bspline, playgroundLink] }));
})();

</script>
